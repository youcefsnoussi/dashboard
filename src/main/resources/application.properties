spring.datasource.url = jdbc:postgresql://192.168.1.231:5432/commercial


spring.datasource.username = postgres
spring.datasource.password = Admin125478
#spring.datasource.password = root
spring.datasource.driverClassName = org.postgresql.Driver

#server.error.whitelabel.enabled=false

spring.jpa.hibernate.ddl-auto = update
#--------> format_sql only pretty-prints logged SQL; off = less work per query
spring.jpa.properties.hibernate.format_sql=false

#--------> keep warm connections open: the DB server is remote (~130 ms per new
#          connection), so reusing them removes that cost from every page
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=20000

#--------> static assets (JS/CSS/images) cached in the browser for a day
#          (Boot 2.3 spelling: spring.resources.*)
#  Safe to cache hard because the app-theme links carry a ?v= token: bump that
#  token after editing the CSS/JS and every browser fetches the new URL at once.
#  (Turning caching OFF instead made every page slow - Thymeleaf recompiled the
#   template per request and no asset was ever reused.)
spring.resources.cache.cachecontrol.max-age=86400
spring.resources.chain.cache=true

#--------> gzip responses: the chart library alone is ~1 MB uncompressed
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=2048

#--------> compile templates once instead of on every request
#  Leaving this off recompiles EVERY template on EVERY request - the single
#  biggest cause of "the page takes forever". Restart to pick up edits.
spring.thymeleaf.cache=true

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation = true

#--------> en cas AJAX JSON probleme serialization

spring.jackson.serialization.fail-on-empty-beans=false 

#--------> en cas AJAX JSON probleme serialization

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.SecurityAutoConfiguration

#server.max-http-header-size=20000000000

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

#-----------------------

spring.session.timeout = 30m
server.servlet.session.timeout = 30m

