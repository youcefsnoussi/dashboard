	<script type="text/javascript">
	
	$(document).ready(function() {
		
		
		var getUrlParameter = function getUrlParameter(sParam) {
		    var sPageURL = window.location.search.substring(1),
		        sURLVariables = sPageURL.split('&'),
		        sParameterName,
		        i;

		    for (i = 0; i < sURLVariables.length; i++) {
		        sParameterName = sURLVariables[i].split('=');

		        if (sParameterName[0] === sParam) {
		            return sParameterName[1] === undefined ? true : decodeURIComponent(sParameterName[1]);
		        }
		    }
		};
		
		var id_bl = getUrlParameter('id_bl');
		
		var num_bl = getUrlParameter('num_bl');
		
		var type = getUrlParameter('type');
		
		var t = "print_bti";
		
		if(id_bl!=null){
			
			$('#print_content').html('<iframe id="frame" width="100%" height="828" frameborder="0" '+
					'src="'+t+'?id_bl='+id_bl+'"></iframe>');
			
			$("#title_bl").text("Détail BL N° "+num_bl);
			
			$("#icone_bl").attr("class","far fa-file-invoice");
			
			$("#bl_detail_modal").modal("show");
				
		}
		
		//--------------------------
		
		$(".art").on("change",function(){
			
			let tr = $(this).attr("id_tr");
			
			let parrent = $("#"+tr);
			
			//-------------------- get unite chargement by art -----------------
			
			let id_art = $('option:selected', this).val();
			
			parrent.find('#id_magasin').empty();
			
			$.ajaxSetup({async: false});
			$.ajax({
				url: 'ajax_get_magasin_by_art',
				//type: 'POST',
				dataType: 'json',
				data : {
					id_article	: id_art
		        },
		        success : function(responseJson) {
		        	
					$.each(responseJson, function(key, value) {
						
						parrent.find("#id_magasin").each(function(){
							
							$(this).append('<option value="'+value.id+'" > '+value.name+' </option>');
							
						});
						
					});
					
				}
			});
			
			parrent.find("#id_um").val($('option:selected', this).attr("id_um"));
			
		});
		
		$(".zero").focus(function(){
			
			if($(this).val()==0){
				
				$(this).val("");
				
			}
			
		});
		
		$(".zero").blur(function(){
			
			if($(this).val()==""){
				
				$(this).val(0);
				
			}
			
		});
		
		$("#sub_bt").click(function() {
			
			var wd = 0;
			
			var err = "";
			
			$(".qte").each(function() {
					
				if(parseFloat($(this).val())!=0){
					
					wd = 1;
					
				}
				
			});
			
			if($("#destination").val()!="" && wd==1){
				
				wd = 1;
				
			}
			else{ wd = 0;}
			
			if(wd==0){
				
				alert("Veuillez Indiquer la destination \n Veuillez Selectioner des produit et leurs quantité !!!")
				
			}
			else{
				
				$("#frm").submit();
				
			}
			
			
		})
		
	});
	
	</script>
	      
		<link rel="stylesheet" href="resources\additionalCSS\app-theme.css?v=20260902c">

	<body >
	
	<!-- ---------------------------------------- -->
	
	<script type='text/javascript'> spin_it('on'); </script>
	
	<!-- ---------------------------------------- -->
	
	<div class="container-fluid h-100">
	
		<div class="card">
	
			<h3 class="card-header  text-center">
				<i class="far fa-file-invoice"></i> Bon de Transfert Interne <button type="button" id="sub_bt" class="btn btn-success">Valider</button>
			</h3>
			
			<br>
	
			<div class="card-body">
	
	
				<form id="frm" th:action="@{/new_bon_transfert_interne}" method="post" style="height: 100%" autocomplete="off">
					
					<div class="card">
	
	
						<h5 class="card-header "> <i class="far fa-user-alt"></i> Client </h5>
						<br>
	
						<div class="card-body">
						
							<div class="row">
	
								<div class="col-md-4 column">
								
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 130px; text-align: left;">Déstiné a : </span>
										</div>
										<input type="text" id="destination" name="destination" class="form-control" required>
										
									</div>
								</div>
								
							</div>
							
						</div>
						
					</div>
					
					<hr>
	
					<table class="table" id="table" width="100%">
						<thead class="thead-dark">
							<tr>
								<th align="center"  width="8%">Art</th>
								<th  align="center" >Libellé</th>
								<th  align="center"  width="8%">Um</th>
								<th  align="center" >Qte</th>
								<th  align="center" >Unité</th>
							</tr>
						</thead>
	
						<tbody>
	
							<tr th:each="i : ${#numbers.sequence( 1, 20, 1)}" th:attr="id='tr'+${i}" >
	
								<td> <input class="form-control nom_art" type="text" value="" id="code_art" readonly> </td>
								
								<td> <select id="art" class="form-control selectpicker art" data-style="btn btn-outline-secondary" 
										data-size="8" data-live-search="true" name="art" th:attr="id_tr='tr'+${i}">
										<option value="0" selected>Selection</option>
										
										<option th:each="art:${articles}" th:value="${art.id}" th:text="${art.libelle}"
										th:attr="code=${art.code}, data-subtext=${art.code}, 
										um=${art.unite_mesure_vente.nom_unite_mesure}, 
										id_um=${art.unite_mesure_vente.id} "></option>
										
									 </select> 
								</td>
								
								<td> <input class="form-control unite_mesure" id="unite_mesure" type="text" value="" style="text-align: center;" readonly> 
										<input type="hidden" id="id_um" name="id_um" value="0" > </td>
								
								<td> <input class="form-control qte zero" id="qte" name="qte" type="number" step="any" value="0" style="text-align: right;" > </td>
								
								<td> 
									<select id="id_magasin" name="id_magasin" class="form-control id_magasin">
										<option value="0" selected>Selection</option>
									</select>	
								</td>
								
							</tr>
	
						</tbody>
	
					</table>
	
				</form>
	
			</div>
		</div>
	
	</div>
	
	<script type='text/javascript'> spin_it('off'); </script>
