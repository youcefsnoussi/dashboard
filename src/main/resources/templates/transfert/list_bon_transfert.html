		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\sum().js"></script>
		
		<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
		
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript">
		
		$(document).ready(function() {
			
			var getUrlParameter = function getUrlParameter(sParam) {
			    var sPageURL = window.location.search.substring(1),
			        sURLVariables = sPageURL.split('&'),
			        sParameterName,
			        i;

			    for (i = 0; i < sURLVariables.length; i++) {
			        sParameterName = sURLVariables[i].split('=');

			        if (sParameterName[0] === sParam) {
			            return sParameterName[1] === undefined ? true : decodeURIComponent(sParameterName[1]);
			        }
			    }
			};
			
			var ret = getUrlParameter('ret');
			
			if(ret!=null){
				
				$("#title").text("Information");
				$("#icone").attr("class","far fa-info-circle");
				
				$("#text").text("Annulation effectuer avec succes ");
				
				$("#error").modal('show');
					
			}
			
			$('[data-toggle="tooltip"]').tooltip()
			
			var datatable_config = {
					"language": {
				            "url": "resources/Plugins/datatable/lang/French.json"
				    },
					"ordering": true,
			    	"bPaginate": false,
					"scrollY":"600px",
					"scrollX": "auto",
			        "deferRender": true,
			        "columnDefs": [
			            { "width": "7%", "targets": 8 }
			          ],
			        initComplete: function () {
			            this.api().columns([3,4,5,6]).every( function () {
			                var column = this;
			                var select = $('<select class="selectpicker show-tick" data-width="fit" data-style="btn btn-outline-secondary" '+
			                				'.data-live-search="true" data-container="body"><option value="">Tout</option></select>')
			                    .appendTo( $(column.footer()).empty() )
			                    .on( 'change', function () {
			                        var val = $.fn.dataTable.util.escapeRegex(
			                            $(this).val()
			                        );
			 
			                        column
			                            .search( val ? '^'+val+'$' : '', true, false )
			                            .draw();
			                    } );
			 
			                column.data().unique().sort().each( function ( d, j ) {
			                    select.append( '<option value="'+d+'">'+d+'</option>' )
			                } );
			            } );
			        },
					 drawCallback: function () {
						 
						 var api = this.api();
						 
						 $( api.column( 8, {page:'current'} ).footer() ).html(
					        api.column( 8, {page:'current'} ).data().sum().formatMoney(3, ',', ' ')
					      );
					 },
		    };
		 		
		 	var table = $('#table').DataTable(datatable_config);
			
			$(".print").click(function(){
				
				var id_bt = $(this).attr("id_bt");
				
				var num_bt = $(this).attr("num_bt");
				
				$('#print_content').html('<iframe id="frame" width="100%" style="height:75vh" onload="ifrhgh()" frameborder="0" '+
						'src="print_bt?id_bt='+id_bt+'"></iframe>');
				
				$("#title_bl").text("Détail BT N° "+num_bt);
				
				$("#icone_bl").attr("class","far fa-file-invoice");
				
				$("#bl_detail_modal").modal("show");
				
			});
			
			$("#printAll").click(function(){
				
				var start = $("#debut").val();
				
				var end = $("#fin").val();
				
				if(start=="" || end==""){
					
					$("#title").text("Erreur !!!");
					$("#icone").attr("class","far fa-exclamation-triangle");
					$("#text").html("<span> Veuillez selectionner les dates !!! <span>");
					$("#error").modal('show');
					
				}
				else{
					
					$('#print_content').html('<iframe id="frame" width="100%" height="828" frameborder="0" '+
												'src="print_bts?start='+start+'&end='+end+'"></iframe>');
					
					$("#title_bl").text("Imprimer ");
					
					$("#icone_bl").attr("class","far fa-file-invoice");
					
					$("#bl_detail_modal").modal("show");
					
				}
				
			});
			
			$("#afficher").click(function(){
				
				var start = $("#debut").val();
				
				var end = $("#fin").val();
				
				if(start=="" || end==""){
					
					$("#title").text("Erreur !!!");
					$("#icone").attr("class","far fa-exclamation-triangle");
					$("#text").html("<span> Veuillez selectionner les dates !!! <span>");
					$("#error").modal('show');
					
				}
				else{
					
					//console.log("start = "+start+" / end = "+end);
					window.location.replace("list_bon_transfert?start="+start+"&end="+end);
					
				}
				
			});
			
			var id_bt;
			
			$(".cancel").click(function(){
				
				id_bt = $(this).attr("id_bt");
				var num_bt = $(this).attr("num_bt");
				var code_client = $(this).attr("code_client");
				var montant = $(this).attr("montant");
				var factured = $(this).attr("etat_liv");
				
				$("#text_confirmation").html("Etes vous sure d'annuler le Bon de Transfert N°<b>"+num_bt+"</b>  ?");
				
				$("#confirmation").modal('show');
				
			});
			
			$("#confirm").click(function(){
				
				$.ajax({
					url : 'cancel_bt',
					data : {
						id_bt : id_bt
					},
					success : function(responseJson) {
						
						location.reload();
						
					}
					
				});
				
			});
			
		});

		$(function () {
		    $('#fact_detail_modal').on('shown.bs.modal', function () {
		        /* $('#print_content').html('<iframe id="frame" width="100%" height="100%" onload="ifrhgh()" 
		        		frameborder="0" src="/add_client"></iframe>'); */
		    });
		});

		function ifrhgh(){
		    var iframehght =  $("#frame").contents().height();
		    $("#frame").height(iframehght);
		}
		
		</script>
		
		<style type="text/css">
		
			.rr{
			
				text-align: right;

	</head>
<body>
	
	 <div class="container-fluid h-100"> <!-- container h-100 -->
		
		<div class="card ">
		
			
			<div class="card-header  text-center"> 
			
				<div class="row">
					
					<div class="col-md-4 offset-md-1" >
						
						<div class="input-group">
						
							<div class="input-group-append">
							
								<input id="debut" type="date" name="start" th:value="${date_d}"  class="form-control date" 
									style="width:100%;" placeholder="DU">
									
								<span class="input-group-text declaration"><i class="far fa-calendar-alt"></i> </span>
								
								<input id="fin" type="date" name="end" th:value="${date_f}" class="form-control date" 
								style="width:100%;" placeholder="AU">
								
								<button id="afficher" name="afficher" class="btn btn-dark" type="button">Afficher</button>
								
							</div>
							
						</div>
						
					</div>
					
					<div class="col-md-1 offset-md-1" >
						
						<button id="printAll" name="afficher" class="btn btn-dark" type="button">Imprimer</button>
						
					</div>
					
					<div class="col-md-4 offset-md-1">
					
						<h3 class="text-center"> <i class="far fa-clipboard-list-check"></i>  List des Bons Transfert </h3>
					
					</div>
					
				</div>
			
			</div>
			
			<div class="card-body">
			
				<div class="container-fluid">
					<table id="table" class="table table-bordered table-hover" style="width:100%">
					
						<thead class="thead-dark">
						
							<tr>
							
								<th>N°</th>
								<th>Date</th>
								<th>Heure</th>
								<th>Source</th>
								<th>Destination</th>
								<th>Matricule </th>
								<th>Chauffeur</th>
								<th>Article</th>
								<th>Qunatite</th>
								<th></th>
								
							</tr>
						
						</thead>
						
						<tbody>
						
							<tr th:each="btd:${list_btd}">
							
								<td th:text="${btd.bon_transfert.numero}"></td>
								<td th:text="${btd.bon_transfert.date}"></td>
								<td th:text="${btd.bon_transfert.time}"></td>
								<td th:text="${btd.magasin.name}" ></td>
								<td th:text="${btd.bon_transfert.unite_interne.designation}"></td>
								<td th:text="${btd.bon_transfert.matricule_vehicule}" ></td>
								<td th:text="${btd.bon_transfert.chauffeur}" ></td>
								<td th:text="${btd.article.libelle}" ></td>
								<td th:text="${#numbers.formatDecimal(btd.quantite, 2, 'WHITESPACE', 3,'POINT')}" ></td>
								<td style="text-align: center;"> <button type="button" class="btn btn-info print" 
																	th:attr="id_bt=${btd.bon_transfert.id},num_bt=${btd.bon_transfert.numero}"> 
																		<i class="far fa-print"></i>
																 </button> 
																 <button th:if="${cancel_bt}==true" type="button" class="btn btn-danger cancel" 
																	th:attr="id_bt=${btd.bon_transfert.id},num_bt=${btd.bon_transfert.numero},
																			 code_client=${btd.bon_transfert.unite_interne.code}"> 
																		<i class="far fa-trash"></i>
																 </button> 
								</td>
								
							</tr>
						
						</tbody>
						
						<tfoot>
						
							<tr>
							
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								
							</tr>
						
						</tfoot>
						
					</table>
				
				</div>
			
			</div>
			
		</div>
		
	</div>

	      <div class="modal-header">
	        <i id="icone" class="far fa-exclamation-triangle" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title">Attention</h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">

	      <div class="modal-body">
	        <p id="text_confirmation"></p>
