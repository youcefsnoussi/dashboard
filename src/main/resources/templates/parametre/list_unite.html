<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application Commercial</title>
		
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\floating-labels.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css">
		<link rel="stylesheet" href="resources\additionalCSS\BootstrapButtonMaterielizeIcon.css" />
		
		<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet"> 
		
		<script  src="resources\additionalJS\jquery-3.2.1.min.js"></script>
		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript" src="resources\PagesJS\parametre\list_unite.js"></script> 
		
</head>
<body>
	
	<div class="container h-100">
		
		<div class="card">
		
			<!-- <i class="large material-icons" style="font-size:30px;">payment</i> -->
			
			<h3 class="card-header  text-center">  <i class="far fa-industry-alt"></i> List des Unites </h3>
			
			<br>
			
			<div class="card-body">
			
				<div class="container">
					
					<div class="row">
					
						<div class="col-md-3">
						
							<button id="add_unite" class="btn btn-dark btn_icon"> <span> Nouvelle unite </span> <i class="far fa-plus-circle"></i> </button>
						
						</div>
					
					</div>
					
					<hr>
					
					<table id="list_b" class="table table-bordered table-hover">
					
						<thead class="thead-dark">
						
							<tr>
							
								<th>Unité</th>
								<th>Modifier</th>
								
							</tr>
						
						</thead>
						
						<tbody>
						
							<tr th:each="unite:${unite}">
							
								<td th:text="${unite.nom_unite}"></td>
								<td style="text-align: center;"> <button type="button" class="btn btn-info edit" th:attr="id_unite=${unite.id},
																														  nom_unite=${unite.nom_unite},
																														  identifiant=${unite.identifiant}"
																														  > 
																				<i class="far fa-edit"></i>
																		 </button> 
								</td>
								
							</tr>
						
						</tbody>
						
					</table>
				
				</div>
			
			</div>
			
		</div>
		
	</div>
	
	<div id="add_edit_unite" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-lg" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i class="" style="font-size:30px;margin-right:10px;" id="icone"></i> <h5 class="modal-title" id="title"> Information </h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      
	      <div class="modal-body">
	        
	        <form id="frm" th:action="@{/add_edit_unite}" method="post" autocomplete="off">
				
				<input type="hidden" id="id_unite" name="id_unite">
				
				<div class="row justify-content-center">
				
					<div class="col-md-4">
					
						<label> Désignation</label>
						
						<input type="text" id="designation" name="designation" class="form-control clear" required>
						
					</div>
					
					<div class="col-md-4">
					
						<label> Identifiant</label>
						
						<input type="number" step="1" id="identifiant" name="identifiant" class="form-control clear" required>
						
					</div>
					
				</div>
				
				<hr>
				
				<div class="d-flex justify-content-center">
				
					<input type="submit" class="btn btn-primary" value="Valider">
				
				</div>
					
			</form>
	        
	      </div>
	      
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	
	
</body>
</html>
