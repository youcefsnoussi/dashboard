<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta
      charset="utf-8"
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Vente Employee Logistique</title>

    <link
      rel="stylesheet"
      href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="resources\Plugins\datatable\css\dataTables.bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="resources\Plugins\jAlert-master\dist\jAlert.css"
    />
    <link
      rel="stylesheet"
      href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css"
    />
    <link
      rel="stylesheet"
      href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css"
    />

    <script
      type="text/javascript"
      src="resources\additionalJS\jquery-3.2.1.min.js"
    ></script>

    <script
      type="text/javascript"
      src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"
    ></script>

    <script
      type="text/javascript"
      src="resources\Plugins\datatable\js\jquery.dataTables.min.js"
    ></script>
    <script
      type="text/javascript"
      src="resources\Plugins\datatable\js\dataTables.bootstrap.min.js"
    ></script>

    <script
      type="text/javascript"
      src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"
    ></script>

    <script
      type="text/javascript"
      src="resources\additionalJS\jquery-spin.js"
    ></script>
    <script
      type="text/javascript"
      src="resources\additionalJS\drahem.js"
    ></script>
    <script
      type="text/javascript"
      src="resources\additionalJS\spin.js"
    ></script>

    <script
      type="text/javascript"
      src="resources\PagesJS\vente\vente_employee.js"
    ></script>
		<link rel="stylesheet" href="resources\additionalCSS\app-theme.css?v=20260902c">
		<script src="resources\additionalJS\app-theme.js?v=20260902c"></script>
	</head>

  <body>
    <!-- ---------------------------------------- -->

    <script type="text/javascript">
      spin_it('on');
    </script>

    <!-- ---------------------------------------- -->

    <div class="container-fluid h-100">
      <div class="card">
        <div class="card-body">
          <form
            id="frm"
            th:action="@{/new_commande_employee_logistique}"
            method="post"
            style="height: 100%"
            autocomplete="off"
          >
            <input
              type="hidden"
              id="id_bl_logistique"
              name="id_bl_logistique"
              th:value="${ble.id}"
            />

            <input
              type="hidden"
              id="card_number"
              name="card_number"
              th:value="${ble.cardNumber}"
            />

            <div class="card">
              <h5 class="card-header">
                <i class="far fa-user-alt"></i> Client
              </h5>

              <br />

              <div class="card-body">
                <div class="row">
                  <div class="col-md-4 column">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span
                          class="input-group-text declaration"
                          style="min-width: 130px; text-align: left"
                          >Employée
                        </span>
                      </div>
                      <select
                        class="selectpicker form-control"
                        data-style="btn btn-outline-secondary"
                        data-live-search="true"
                        name="employee"
                        id="employee"
                        data-size="5"
                        required
                        th:attr="readonly='readonly'"
                      >
                        <option
                          th:text="${ble.matricule_employee}"
                          th:value="${ble.matricule_employee}+'/'+${ble.nom_employee}+'/'+${ble.prenom_employee}"
                          th:attr="data-subtext=${ble.nom_employee}+' '+${ble.prenom_employee}"
                        ></option>
                      </select>
                    </div>
                  </div>

                  <div class="col-md-4 column">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text declaration">Nom</span>
                      </div>
                      <input
                        type="text"
                        name="np"
                        id="nom"
                        class="form-control"
                        th:value="${ble.nom_employee}"
                        readonly="readonly"
                      />
                    </div>
                  </div>

                  <div class="col-md-4 column">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text declaration">Prénom</span>
                      </div>
                      <input
                        type="text"
                        name="prenom"
                        id="prenom"
                        class="form-control"
                        th:value="${ble.prenom_employee}"
                        readonly="readonly"
                      />
                    </div>
                  </div>
                </div>

                <hr />

                <div class="row">
                  <div class="col-md-7">
                    <div class="input-group">
                      <h5>Réduction sur les articles :</h5>
                      <h5 id="redux"></h5>
                    </div>
                  </div>

                  <div class="col-md-4 offset-md-1">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span
                          class="input-group-text declaration"
                          style="min-width: 106px; text-align: left"
                        >
                          Montant HT
                        </span>
                      </div>
                      <input
                        type="hidden"
                        id="total_ht_hidden"
                        th:value="${ble.montant_ht}"
                      />

                      <input
                        type="text"
                        class="form-control"
                        name="total_ht"
                        style="text-align: right"
                        id="total_ht"
                        th:value="${#numbers.formatDecimal(ble.montant_ht, 3, 'WHITESPACE', 2,'POINT')}"
                        readonly="readonly"
                      />
                    </div>
                  </div>
                </div>
                <hr />
                <div class="row">
                  <div class="col-md-4 offset-md-8">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text declaration"
                          >Montant TVA</span
                        >
                      </div>
                      <input
                        type="hidden"
                        id="total_tva_hidden"
                        th:value="${ble.montant_tva}"
                      />
                      <input
                        type="text"
                        class="form-control"
                        name="total_tva"
                        style="text-align: right"
                        id="total_tva"
                        th:value="${#numbers.formatDecimal(ble.montant_tva, 3, 'WHITESPACE', 2,'POINT')}"
                        readonly="readonly"
                      />
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-4 offset-md-8">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text declaration"
                          >Montant TTC
                        </span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        name="total_ttc"
                        style="text-align: right"
                        id="total_ttc"
                        th:value="${#numbers.formatDecimal(ble.montant_ttc, 3, 'WHITESPACE', 2,'POINT')}"
                        readonly="readonly"
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <hr />

            <table class="table" id="table" width="100%">
              <thead class="thead-dark">
                <tr>
                  <th align="center" width="8%">Art</th>
                  <th align="center">Libellé</th>
                  <th align="center" width="8%">Um</th>
                  <th align="center">Qte</th>
                  <th align="center">Unité</th>
                  <th align="center">PU</th>
                  <th align="center">Montant HT</th>
                  <th align="center">TVA</th>
                  <th align="center">Montant TVA</th>
                  <th align="center">Montant TTC</th>
                </tr>
              </thead>

              <tbody>
                <tr
                  th:each="ble_d, i : ${ble_detail}"
                  th:attr="id='tr'+${i.index}"
                >
                  <td>
                    <input
                      class="form-control nom_art"
                      type="text"
                      th:value="${ble_d.article.code}"
                      id="code_art"
                      readonly
                    />
                  </td>

                  <td>
                    <select
                      id="art"
                      class="form-control selectpicker art"
                      data-style="btn btn-outline-secondary"
                      data-size="8"
                      data-live-search="true"
                      name="art"
                      th:attr="id_tr='tr'+${i.index}"
                    >
                      <option
                        th:value="${ble_d.article.id}"
                        th:text="${ble_d.article.libelle}"
                        th:attr="code=${ble_d.article.code}, data-subtext=${ble_d.article.code}, 
										um=${ble_d.article.unite_mesure_vente.nom_unite_mesure}, pu=${ble_d.prix_u_ht}, 
										tva=${ble_d.tva}, id_um=${ble_d.article.unite_mesure_vente.id} "
                      ></option>
                    </select>
                  </td>

                  <td>
                    <input
                      class="form-control unite_mesure"
                      id="unite_mesure"
                      type="text"
                      style="text-align: center"
                      th:value="${ble_d.article.unite_mesure_vente.nom_unite_mesure}"
                      readonly
                    />
                    <input
                      type="hidden"
                      id="id_um"
                      name="id_um"
                      th:value="${ble_d.article.unite_mesure_vente.id}"
                    />
                  </td>

                  <td>
                    <input
                      class="form-control qte zero"
                      id="qte"
                      name="qte"
                      type="number"
                      step="any"
                      th:value="${ble_d.quantite}/100"
                      style="text-align: right"
                    />
                  </td>

                  <td>
                    <select
                      id="id_magasin"
                      name="id_magasin"
                      class="form-control id_magasin"
                    >
                      <option value="0" selected>Selection</option>
                    </select>
                  </td>

                  <td>
                    <input
                      class="form-control prix_unitaire"
                      id="prix_unitaire"
                      name="prix_unitaire"
                      type="number"
                      step="any"
                      style="text-align: right"
                      th:value="${ble_d.prix_u_ht}*100"
                      readonly
                    />
                  </td>

                  <td>
                    <input
                      class="form-control montant_ht"
                      id="montant_ht"
                      name="montant_ht_art"
                      type="text"
                      style="text-align: right"
                      th:value="${ble_d.montant_ht}"
                      readonly
                    />
                  </td>

                  <td>
                    <input
                      class="form-control tva"
                      id="tva_art"
                      name="tva_art"
                      type="number"
                      step="any"
                      style="text-align: right"
                      th:value="${ble_d.tva}"
                      readonly
                    />
                  </td>

                  <td>
                    <input
                      class="form-control montant_tva remise_zero"
                      id="montant_tva"
                      name="montant_tva_art"
                      type="text"
                      th:value="${ble_d.montant_tva}"
                      style="text-align: right"
                      readonly
                    />
                  </td>

                  <td>
                    <input
                      class="form-control montant_ttc remise_zero"
                      id="montant_ttc"
                      name="montant_ttc_art"
                      type="text"
                      th:value="${ble_d.montant_ttc}"
                      style="text-align: right"
                      readonly
                    />
                  </td>
                </tr>
              </tbody>
            </table>

            <hr />

            <div class="d-flex justify-content-center">
              <button type="button" id="sub" class="btn btn-success">
                Valider
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      spin_it('off');
    </script>

    <div id="error" class="modal" tabindex="-1" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <i
              id="icone"
              class=""
              style="font-size: 30px; color: red; margin-right: 10px"
            ></i>
            <h5 class="modal-title" id="title"></h5>
            <button
              type="button"
              class="close"
              data-dismiss="modal"
              aria-label="Close"
            >
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <p id="text"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="fermer"
              class="btn btn-secondary"
              data-dismiss="modal"
            >
              Fermer
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="bl_detail_modal" class="modal" tabindex="-1" role="dialog">
      <div
        class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75"
        role="document"
      >
        <div class="modal-content">
          <div class="modal-header">
            <input type="hidden" id="id_facture" />

            <div class="col-md-6">
              <div class="input-group">
                <div class="input-group-prepend">
                  <i
                    id="icone_bl"
                    class="far fa-file-invoice"
                    style="font-size: 30px; margin-right: 10px"
                  ></i>
                </div>
                <h5 id="title_bl" class="modal-title"></h5>
              </div>
            </div>
            <button
              type="button"
              class="close"
              data-dismiss="modal"
              aria-label="Close"
            >
              <span aria-hidden="true">&times;</span>
            </button>
          </div>

          <div class="modal-body">
            <div id="print_content">
              <!-- <iframe id="frame" width="100%" height="100%" onload="ifrhgh()" frameborder="0" src="/new_payment"></iframe> -->
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-dismiss="modal"
            >
              Fermer
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
