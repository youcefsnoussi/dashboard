<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Insert title here</title>
	
	
	<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
	<link rel="stylesheet" href="resources\Plugins\datatable\css\dataTables.bootstrap.min.css">
	<link rel="stylesheet" href="resources\Plugins\jAlert-master\dist\jAlert.css">
	<link rel="stylesheet" href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css">
	<link rel="stylesheet" href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css"> 
	
	<script type="text/javascript" src="resources\additionalJS\jquery-3.2.1.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
	<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
	
	<script type="text/javascript" src="resources\additionalJS\jquery-spin.js"></script>
	<script type="text/javascript" src="resources\additionalJS\spin.js"></script>  
	<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
	
	<script type="text/javascript" src="resources\PagesJS\vente\facture.js"></script>
	      
	<script type="text/javascript" src="resources\additionalJS\CheckConnectionServer.js"></script>
	      
	</head>

	<body >
	<br>
	<!-- ---------------------------------------- -->
	
	<script type='text/javascript'> spin_it('on'); </script>
	
	<!-- ---------------------------------------- -->
	
	<div class="container-fluid h-100">
	
		<div class="card">
	
			<h3 class="card-header  text-center">
				<i class="far fa-file-invoice"></i> Commande <button type="button" id="sub" class="btn btn-success">Valider</button>
			</h3>
			
			<br>
	
			<div class="card-body">
	
	
				<form id="frm" th:action="@{/new_commande_post}" method="post" style="height: 100%" autocomplete="off">
					
					<input type="hidden" id="tva_general" name="tva" value="0.19">
	
	
					<div class="card">
	
						<div class="card-header">
							
							<div class="row">
							
								<div class="col-md-3">
								
									<h5 > <i class="far fa-user-alt"></i> Client </h5>
								
								</div>
								
								<div class="col-md-3">
								
									<button type="button" id="new_payment" class="btn btn-warning btn-sm">
										<i class="far fa-money-bill-wave"></i> Nouveau Paiement 
									</button>
								
								</div>
							
							</div>
							
						</div>		
						
						<br>
	
						<div class="card-body">
							
							<div class="row">
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 130px; text-align: left;">RC </span>
										</div>
										<select class="selectpicker form-control" data-style="btn btn-outline-secondary" data-live-search="true"
											name="id_rel_rc_clt" id="rc" data-size="5">
											<option  disabled value="" selected>Registre Commerce</option>
											
											<option th:each="rc_clt:${rcs_clt}" th:value="${rc_clt.id}" th:text="${rc_clt.registre_commerce.code}" 
													th:attr="data-subtext=${rc_clt.registre_commerce.nom}+' '+${rc_clt.registre_commerce.prenom},
													code_clt=${rc_clt.registre_commerce.code}, nom=${rc_clt.registre_commerce.nom}, 
													prenom=${rc_clt.registre_commerce.prenom}, sold=${rc_clt.registre_commerce.sold_encours}, 
													plafond=${rc_clt.registre_commerce.plafond}, tva=${rc_clt.registre_commerce.tva},
													adresse=${rc_clt.registre_commerce.adresse}, mode_pay=${rc_clt.registre_commerce.mode_paiement.id},
													is_blf=${rc_clt.registre_commerce.multiple_bon_livraison}"
													>
											</option>
											
										</select>
										
										<input type="hidden" id="tv">
										
									</div>
								</div>
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration">Désignation</span>
										</div>
										<input type="text" name="designation_rc" id="designation_rc" class="form-control " readonly="readonly">
	
									</div>
								</div>
	
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 76px; text-align: left;">Adresse </span>
										</div>
										<input type="text" class="form-control " name="adresse_rc"
											id="adresse_rc" value="" readonly="readonly">
									</div>
								</div>
	
							</div>
	
							<br>
	
							<div class="row">
								<div class="col-md-5 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 76px; text-align: left;">Solde </span>
										</div>
										<input type="text" class="form-control " name="solde_rc"
											id="solde_rc" value="" readonly="readonly">
									</div>
								</div>
								<div class="col-md-5 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 76px; text-align: left;">Max Solde </span>
										</div>
										<input type="text" class="form-control " name="max_solde_rc"
											id="max_solde_rc" value="0" readonly="readonly">
									</div>
								</div>
								<div class="col-md-2 column">
								
									<h5>Exonération <span class="badge badge-secondary" id="exo"></span></h5>
									
								</div>
							</div>
	
							<hr>
							
							<div class="row">
	
								<div class="col-md-6 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 130px; text-align: left;">Mode règelment </span>
										</div>
										<select class="form-control " name="mode_reg" id="mode_reg" >
											
											<option disabled="disabled" value="" selected>Mode règelment</option>
											<option th:each="mode_r:${mode_paiements}" th:value="${mode_r.id}" th:text="${mode_r.designation}"></option>
	
										</select>
									</div>
								</div>
	
								<div class="col-md-6 column">
									
									<div class="row">
										
										<div class="col-md-1">
										
											<div id="loading" class="spinner-grow" role="status">
											  <span class="sr-only">Loading...</span>
											</div>
										
										</div>
										
										<div class="col-md-11">
										
											<div class="row">
											
												<div class="col-md-1">
												
													<input type="radio" id="radio_select" name="selected" class="form-control rr" checked="checked">
												
												</div>
												
												<div class="col-md-11">
												
													<select class="selectpicker form-control" data-style="btn btn-outline-secondary" data-live-search="true"
														name="matricule" data-size="5" id="select_mat">
														<option  value="" selected>Matricule</option>
														<option  th:each="mat : ${matricule}" th:value="${mat}" th:text="${mat}"></option>
														
													</select>
												
												</div>
												
											</div>
											<hr>
											<div class="row">
											
												<div class="col-md-1">
												
													<input type="radio" id="radio_input" name="selected" class="form-control rr" value="">  
												
												</div>
												
												<div class="col-md-11">
												
													<div class="input-group">
													<div class="input-group-prepend">
														<span class="input-group-text declaration"
															style="min-width: 130px; text-align: left;">Matricule</span>
													</div>
													<input type="text" class="form-control mouve" name="" id="input_mat" value="" 
														 placeholder="xxxxxx-xxx-xx" disabled> 
														
														<input type="hidden" id="c_type_cl" value="0">
														
											</div>
												
												</div>
												
											</div>
											  
										</div>
										
									</div>
									
								</div>
	
							</div>
	
							<hr>
							
							<div class="row">
							
								<div class="col-md-7 ">
									<!--  
									<div class="input-group">
						
										<h5>Réduction sur les articles :</h5><h5 id="redux">  </h5>
									
									</div>
									-->
									<label>Observation</label>
									
									<textarea rows="3" cols="" id="observation" class="form-control" name="observation"></textarea> 
									
									
									
									<div id="chauffeur" style="display:none">
										<hr>
										<label>Chauffeur</label>
										<input type="text" id="chauffeur_inp" class="form-control" name="chauffeur" display="false">
									</div>
									
								</div>
								
								<div class="col-md-4 offset-md-1">
									
									<div class="row">
										
										<div class="col-md-12">
											
											<div class="input-group">
											
												<div class="input-group-prepend">
													<span class="input-group-text declaration" style="min-width: 106px; text-align: left;"> 
														Total HT </span>
												</div>
												<input type="text" step="any" class="form-control remise_zero" name="total_ht" style="text-align: right;" 
													id="total_ht" value="0" readonly="readonly">
												<input type="hidden" id="total_ht_hidden" value="0">
													
											</div>
											
										</div>
										
									</div>
									
									<div class="row">
							
										<div class="col-md-12">
											<div class="input-group">
											<input type="hidden" id="remise_fact"  th:value="${remise_fact}">
													<span class="input-group-text declaration" style="text-align: left;">
													 Remise (%) </span>
												<input type="number" step="any" class="form-control zero remise_zero" name="pourc_reduction" 
													style="text-align: right;" id="pourc_redux" value="0" >
												
												<input type="text" class="form-control zero remise_zero" name="montant_reduction" 
													style="text-align: right;" id="mnt_redux" value="0" >
												
												<span class="input-group-text declaration" 
																style="min-width: 106px; text-align: left;"> Remise (Val) </span>
														
													
											</div>
										</div>
									
									</div>
									
									<div class="row">
										<div class="col-md-12">
										
											<div class="input-group">
												<div class="input-group-prepend">
													<span class="input-group-text declaration" style="min-width: 106px; text-align: left;">
													 Total HT Net </span>
												</div>
												<input type="text" class="form-control remise_zero" name="total_ht_net" style="text-align: right;" 
													id="total_ht_net" value="0" readonly="readonly">
											</div>
										
										</div>
										
									</div>
									
								</div>
							
							</div>
							
							<div class="row">
							
								<div class="col-md-4 offset-md-8">
								
									<hr>
								
								</div>
							
							</div>
							
							<div class="row">
								
								<div class="col-md-4 offset-md-8">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration">Total TVA</span>
										</div>
										<input type="hidden" id="total_tva_hidden" value="0">
										<input type="text" class="form-control remise_zero" name="total_tva" style="text-align: right;" id="total_tva" 
											value="0" readonly="readonly">
									</div>
								</div>
							
							</div>
							
							<div class="row">
								
								<div class="col-md-4 offset-md-8">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration">Total TTC </span>
										</div>
										<input type="text" class="form-control remise_zero" name="total_ttc" style="text-align: right;" id="total_ttc" 
											value="0" readonly="readonly">
									</div>
								</div>
	
							</div>
							
						</div>
					</div>
					
					<hr>
	
					<table class="table" id="table" width="100%">
						<thead class="thead-dark">
							<tr>
								<th align="center"  width="5%">Art consigne</th>
								<th  align="center" >Libellé</th>
								<th  align="center"  width="3%">Um</th>
								<th  align="center" >Qte</th>
								<th  align="center" >Unité</th>
								<th  align="center" >PU</th>
								<th  align="center" >MONTANT HT</th>
								<th  align="center" >Remise ( Val / % )</th>
								<th  align="center" >Montant NET HT</th>
								<th  align="center" >TVA (%)</th>
								<th  align="center" >Montant TVA</th>
								<th  align="center" >Montant TTC</th>
								
							</tr>
						</thead>
	
						<tbody>
	
							<tr th:each="i : ${#numbers.sequence( 1, 20, 1)}" th:attr="id='tr'+${i}" >
	
								<td> 
									<select class="form-control selectpicker select_consign" data-style="btn btn-outline-secondary" 
										id="select_consign" data-width="100%" name="select_consign" th:attr="id_tr='tr'+${i}" 
										multiple data-actions-box="true" data-selected-text-format="count"> 
										
									</select>
									<input type="hidden" id="art_consign" name="art_consign" class="art_consign">
								</td>
								
								<td> 
									 <select id="art" class="form-control selectpicker art" data-style="btn btn-outline-secondary" data-size="8"
									 	data-live-search="true" name="" th:attr="id_tr='tr'+${i}">
										<option value="0" id_um="0" pu="0" tva="0" selected>Selection</option>
									 </select> 
								</td>
								
								<td> <input class="form-control unite_mesure" id="unite_mesure" type="text" value="" style="text-align: center;" 
										readonly> 
										<input type="hidden" id="id_um" name="id_um" value="0" > </td>
								
								<td> 
									<input class="form-control qte zero remise_zero" id="qte" name="qte" type="number" step="any" value="" 
										style="text-align: right;" readonly>
									<input type="hidden" class="pesage_palette" id="pesage_palette"> 
								</td>
								
								<td> 
									<select id="id_magasin" name="id_magasin" class="form-control id_magasin">
										
									</select>	
								</td>
								
								<td><input class="form-control prix_unitaire remise_zero" id="prix_unitaire" name="prix_unitaire" type="text" 
									style="text-align: right;" readonly> </td>
								
								<td><input class="form-control montant_ht remise_zero" id="montant_ht" name="montant_ht_art" type="text" 
									style="text-align: right;" readonly> </td>
								
								<td>
									<div class="input-group">
										<input class="form-control redux_art_val zero remise_zero" id="redux_art_val" name="montant_redux_art_val" type="number" 
											step="any" style="text-align: left;" placeholder="Val" value="0">
										<input class="form-control redux_art_pourc zero remise_zero" id="redux_art_pourc" name="montant_redux_art_pourc" 
											type="number" step="any" style="text-align: right;" placeholder="%" value="0">  
									</div>
								</td>
								
								<td><input class="form-control montant_net_ht remise_zero" id="montant_net_ht" name="montant_net_ht_art" type="text" 
									style="text-align: right;" value="0" readonly> </td>
								
								<td><input class="form-control tva remise_zero" id="tva_art" name="tva_art" type="number" step="any" value="0" 
									style="text-align: right;" readonly> </td>
								
								<td><input class="form-control montant_tva remise_zero" id="montant_tva" name="montant_tva_art" type="text" value="0"
									style="text-align: right;" readonly> </td>
									
								<td><input class="form-control montant_ttc remise_zero" id="montant_ttc" name="montant_ttc_art" type="text" value="0" 
									style="text-align: right;" readonly> </td>	
								
							</tr>
	
						</tbody>
	
					</table>
	
				</form>
	
			</div>
		</div>
	
	</div>
	
	<script type='text/javascript'> spin_it('off'); </script>
	
	<!-- -------------------------------------------------------------------------------- -->
	
	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <p id="text"></p>
	      </div>
	      <div class="modal-footer">
	        <button type="button" id="fermer" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	<!-- ----------------------------------------------------------------------------------------------------------------- -->
	
	<div id="new_payment_modal" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone_pay" class="far fa-user-alt" style="font-size:30px;margin-right:10px;" ></i> <h5 id="title_pay" class="modal-title" > </h5>
	        <button type="button" class="close close_pay" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      
	      <div class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;" id="print_content_pay" >
	         
	      </div>
	      
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary cloose close_pay" data-dismiss="modal" >Fermer</button>
	      </div>
	      
	    </div>
	  </div>
	</div>
	
	<!-- ----------------------------------------------------------------------------------------------------------- -->
	
	<div id="bl_detail_modal" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	      		
	      		<input type="hidden" id="id_facture">
	      		
	      		<div class="col-md-6">
	      			
	      			<div class="input-group">
	      				<div class="input-group-prepend">
	      					<i id="icone_bl" class="far fa-file-invoice" style="font-size:30px;margin-right:10px;" ></i>
	      				</div>	
	      					<h5 id="title_bl" class="modal-title" > </h5>
			        </div>	
	      		</div>
	      	<button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      	
	      </div>
	      
	      <div class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;" id="print_content" >
	         
	      </div>
	      
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	      
	    </div>
	  </div>
	</div>
	
	</body>
	
</html>
