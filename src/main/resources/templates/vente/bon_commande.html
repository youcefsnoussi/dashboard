<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Insert title here</title>
	
	
	<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
	<link rel="stylesheet" href="resources\Plugins\datatable\css\dataTables.bootstrap.min.css">
	<link href="resources\Plugins\jAlert-master\dist\jAlert.css" rel="stylesheet">
	<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet">
	<link href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css" rel="stylesheet"> 
	
	<script type="text/javascript" src="resources\additionalJS\jquery-3.2.1.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
	<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
	
	<script type="text/javascript" src="resources\additionalJS\jquery-spin.js"></script>
	<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
	<script type="text/javascript" src="resources\additionalJS\spin.js"></script>  
	
	    
	<script type="text/javascript">
	
	$(document).ready(function() {
		
		//$('#code_client').bind("enterKey",function(e){
			
		$("#id_client").change(function(){
		
			$("#designation").val("");
			$("#adresse").val("");
			$("#solde").val("");
			$("#max_solde").val("");
			$("#matricule").val("");
			
			var recherche = $("#id_client option:selected").attr("code_clt");
			
			console.log("==>"+recherche);
			
			spin_it('on');
			$.ajax({
				url: 'ajax_get_client_by_code',
				//type: 'POST',
				dataType: 'json',
				data : {
					code	:recherche,
		        },
				success : function(data){
					//console.log(data);
					
						//$("#id_client").val(data.id)
						$("#designation").val(data.nom+' '+data.prenom)
						$("#adresse").val(data.adresse)
						$("#solde").val(parseFloat(data.sold_encours).formatMoney(2, '.', ' '))
						$("#anc_code_client").val(recherche);
						$("#mode_reg").val(data.type_regelement_client);
						$("#max_solde").val(parseFloat(data.plafond).formatMoney(2, '.', ' '));
						$("#mode_reg").val(data.type_reglement.id);
						$("#mode_reg").selectpicker("refresh");
						
						if(($("#c_type_cl").val()!=data.category.id)&&($("#c_type_cl").val()!="")) {
							
							$("#c_type_cl").val(data.category.id);
								
						}
						
						//-------------------- update select RC b client
						
						$('#rc').find('option:not(:first)').remove();
						$("#rc").selectpicker('refresh');
						$("#designation_rc").val("");
						$("#adresse_rc").val("");
						$("#solde_rc").val("");
						$("#max_solde_rc").val("");
						
						$.ajaxSetup({async: false});
						$.ajax({
							url: 'ajax_get_rc_by_client_fact',
							//type: 'POST',
							dataType: 'json',
							data : {
								id_client	:data.id,
					        },
					        success : function(responseJson) {
								
								if (responseJson != "null") {

									$.each(responseJson, function(key, value) {
										
										$("#rc").append('<option value="'+value.id+'" rc="'+value.registre_commerce.numero_rc+'" data-subtext="'+value.registre_commerce.numero_rc+' [ '+value.date_debut+' ➤ '+value.date_fin+' ]" nif="'+value.registre_commerce.numero_nif+'" title="'+value.registre_commerce.numero_rc+'" adresse="'+value.registre_commerce.adresse+'"' 
												+' art="'+value.registre_commerce.numero_art+'" plafond="'+value.registre_commerce.plafond+'" sold="'+value.registre_commerce.sold_encours+'" nom="'+value.registre_commerce.nom+'" prenom="'+value.registre_commerce.prenom+'">'+value.registre_commerce.nom+' '+value.registre_commerce.prenom+'</option>');

									});
									
									$("#rc").selectpicker('refresh');
								}
								
							}
						});
						
						//-------------------------------------------------
						
						//-------------------- Update articles -----------------
						
						$('.art').find('option:not(:first)').remove();
						$(".art").selectpicker('refresh');
						
						$.ajaxSetup({async: false});
						$.ajax({
							url: 'ajax_get_art_by_client_cat',
							//type: 'POST',
							dataType: 'json',
							data : {
								id_client	:data.id,
					        },
					        success : function(responseJson) {
								
								if (responseJson != "null") {

									$.each(responseJson, function(key, value) {
										
										$(".art").each(function(){
										
											$(this).append('<option value="'+value.article.id+'" code="'+value.article.code+'" data-subtext="'+value.article.code+'" um="'+value.article.unite_mesure_vente.nom_unite_mesure+'" pu="'+value.prix+'"' 
													+' tva="'+value.tva.taux_tva+'" id_um="'+value.article.unite_mesure_vente.id+'" >'+value.article.produit.designation+' '+value.article.emballage_produit.nom_emballage+' '+value.article.pesage_produit.pesage+'</option>');
											
											$(this).selectpicker('refresh');
											
										});
										
									});
									
									$(".art").find("option").hide();
									
								}
								
							}
						});
						
						//-----------------------------------------------------
						
						$(".qte").attr("readonly", false);
						$(".qte").val(0);
						$(".prix_unitaire").val(0);
						$(".tva").val(0);
						$(".montant_ht").val(0);
						
						
				},
				error: function (xhr, status) {
		        	
					$("#designation").val("");
					$("#adresse").val("");
					$("#solde").val("");
					$("#max_solde").val("");
					$("#matricule").val("");
					
					$('#rc').find('option:not(:first)').remove();
					$("#rc").selectpicker('refresh');
					$("#designation_rc").val("");
					$("#adresse_rc").val("");
					$("#solde_rc").val("");
					$("#max_solde_rc").val("");
					
					$('#code_client').focus();
					$('#code_client').val("");
					
		        	$("#title").text("Erreur !!!");
					$("#icone").attr("class","far fa-exclamation-triangle");
					$("#text").text("Code Client inexistant ");
					$("#error").modal('show');
					
		        },
			});
			spin_it('off');
			
		});
		
		
		$('#code_client').keyup(function(e){
		    if(e.keyCode == 13)
		    {
		        $(this).trigger("enterKey");
		    }
		    else{
		    	
		    	$(this).val($(this).val().toUpperCase());
		    	
		    }
		});
		
		//----------------------------------------------------------------------
		
		$(".art").change(function(){
			
			var parrent = $(this).parent().parent().parent();
			
			console.log("art val = "+$(this).val())
			
			console.log("art attr before= "+$(this).attr("name"))
			
			if($(this).val()!=""){
				
				$(this).attr("name","art");
				
			}
			else{
				
				$(this).attr("name","");
				
			}
			
			parrent.find("#qte").val(0);
			parrent.find("#code_art").val($('option:selected', this).attr("code"));
			parrent.find("#unite_mesure").val($('option:selected', this).attr("um"));
			parrent.find("#id_um").val($('option:selected', this).attr("id_um"));
			parrent.find("#prix_unitaire").val($('option:selected', this).attr("pu"));
			parrent.find("#tva_art").val($('option:selected', this).attr("tva"));
			
			var pu = parrent.find("#prix_unitaire").val();
			
			parrent.find("#montant_ht").val((pu*0).formatMoney(2, '.', ' '));
			
			var montant_ht = 0;
			
			var montant_tva = 0;
			
			$(".montant_ht").each(function(){
				
				if($(this).val()!=""){
					
					var v = $(this).val();
					
					v = v.replace(/ /g,"");
					
					montant_ht = montant_ht + parseFloat(v);
					
					var tva = $(this).parent().parent().find("#tva_art").val()/100;
					
					montant_tva = montant_tva + ( parseFloat(v) * tva )
					
				}
				
			});
			
			var montant_ttc = montant_ht + montant_tva;
			
			$("#total_ht").val((montant_ht).formatMoney(2, '.', ' '));
			$("#total_tva").val((montant_tva).formatMoney(2, '.', ' '));
			$("#total_ttc").val((montant_ttc).formatMoney(2, '.', ' '));
			
		});
		
		//----------------------------------------------------------------------
		
		$("#rc").change(function(){
			  
			 $("#designation_rc").val($("#rc option:selected").attr("nom")+' '+$("#rc option:selected").attr("prenom"));
			 $("#adresse_rc").val($("#rc option:selected").attr("adresse"));
			 $("#solde_rc").val(parseFloat($("#rc option:selected").attr("sold")).formatMoney(2, '.', ' '));
			 $("#max_solde_rc").val(parseFloat($("#rc option:selected").attr("plafond")).formatMoney(2, '.', ' '));
			 
		});
		
		//----------------------------------------------------------------------
		
		$(".qte").keyup(function(){
			
			var qte = $(this).val();
			
			var parent = $(this).parent().parent();
			
			var pu = parent.find("#prix_unitaire").val();
			
			var val_select_art = parent.find("#art").val();
			
			if(val_select_art!=""){
				
				parent.find("#montant_ht").val((pu*qte).formatMoney(2, '.', ' '));
				
			}
			else{
				
				$("#title").text("Erreur !!!");
				$("#icone").attr("class","far fa-exclamation-triangle");
				$("#text").text("Veuillez selectionner un Article ");
				$("#error").modal('show');
				
				$(this).val(0);
			}
			
			var montant_ht = 0;
			
			var montant_tva = 0;
			
			$(".montant_ht").each(function(){
				
				if($(this).val()!=""){
					
					var v = $(this).val();
					
					v = v.replace(/ /g,"");
					
					montant_ht = montant_ht + parseFloat(v);
					
					var tva = $(this).parent().parent().find("#tva_art").val()/100;
					
					montant_tva = montant_tva + ( parseFloat(v) * tva )
					
				}
				
			});
			
			var montant_ttc = montant_ht + montant_tva;
			
			$("#total_ht").val((montant_ht).formatMoney(2, '.', ' '));
			$("#total_tva").val((montant_tva).formatMoney(2, '.', ' '));
			$("#total_ttc").val((montant_ttc).formatMoney(2, '.', ' '));
			
		});
		
		//-------------------------------- Zero Blur -------------------------------------
		
		$(".zero").focus(function(){
			
			if($(this).val()==0){
				
				$(this).val("");
				
			}
			
		});
		
		$(".zero").blur(function(){
			
			if($(this).val()==""){
				
				$(this).val(0);
				
			}
			
		});
		
		$("#fermer").click(function(){
			
			$('#code_client').focus();
			//$('#code_client').val("");
			
		});
		
		//-------------------------------- Zero Blur -------------------------------------
		/*
		console.log("mode_reg == "+$("#mode_reg").val());
		
		console.log("rc == "+$("#rc").val());
		
		console.log("art == "+$(".art").val());
		*/
		$("#sub").click(function(){
			
			var test = 0;
			
			var msg = "";
			
			if($("#code_client").val()==""){
				
				test++;
				msg = msg+"- Code client incorrect. <br>";
				$("#code_client").css("border-color","red");
				
			}
			
			if($("#rc").val()==""){
				
				test++;
				msg = msg+"- Selectionner un Registre de commerce. <br>";
				//$("#rc").css("border-color","red");
				$(".bs-placeholder").find('[data-id=rc]').css("border-color","red");
				
			}
			
			if($("#date_debut").val()==""){
				
				test++;
				msg = msg+"- Selectionner Date Debut. <br>";
				$("#date_debut").css("border-color","red");
				//$(".bs-placeholder").find('[data-id=rc]').css("border-color","red");
				
			}
			
			if($("#date_fin").val()==""){
				
				test++;
				msg = msg+"- Selectionner Date Debut. <br>";
				$("#date_fin").css("border-color","red");
				//$(".bs-placeholder").find('[data-id=rc]').css("border-color","red");
				
			}
			
			if(test==0){
				
				$("#frm").submit();
					
			}
			
		});
		
	});
			
	
	</script>
	      
	      
	</head>

	<body >
	
	<!-- ---------------------------------------- -->
	
	<script type='text/javascript'> spin_it('on'); </script>
	
	<!-- ---------------------------------------- -->
	
	<div class="container-fluid h-100">
	
		<div class="card">
	
			<h3 class="card-header  text-center">
				<i class="far fa-file-invoice"></i> Bon de commande <button type="button" id="sub" class="btn btn-success">Valider</button>
			</h3>
			
			<br>
	
			<div class="card-body">
	
	
				<form id="frm" th:action="@{/new_BonCommande_post}" method="post" style="height: 100%" autocomplete="off">
					
					<input type="hidden" id="tva_general" name="tva" value="0.19">
	
	
					<div class="card">
	
	
						<h5 class="card-header "> <i class="far fa-user-alt"></i> Client </h5>
						<br>
	
						<div class="card-body">
	
							<div class="row">
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 76px; text-align: left;">Client </span>
										</div>
										<select class="form-control selectpicker" data-style="btn btn-outline-secondary" data-live-search="true"
											name="id_client" id="id_client" data-size="5">
											
											<option disabled="disabled" value="" selected>Client</option>
											<option th:each="clt:${clients}" th:value="${clt.id}" th:text="${clt.code}" 
													th:attr="data-subtext=${clt.nom}+' '+${clt.prenom}, code_clt=${clt.code}"></option>
	
										</select>
										
										<!--  <input type="hidden" id="id_client" name="id_client" value="">  -->
									</div>
								</div>
								<input type="hidden" class="form-control" id="lib_client"
									name="lib_client" value="">
	
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration">Désignation</span>
										</div>
										<input type="text" name="designation" id="designation"
											class="form-control " readonly="readonly">
	
									</div>
								</div>
	
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 76px; text-align: left;">Adresse </span>
										</div>
										<input type="text" class="form-control " name="adresse"
											id="adresse" value="" readonly="readonly">
									</div>
								</div>
	
							</div>
	
							<hr>
	
							<div class="row">
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 130px; text-align: left;">RC </span>
										</div>
										<select class="selectpicker form-control" data-style="btn btn-outline-secondary" data-live-search="true"
											name="id_rel_rc_clt" id="rc" data-size="5">
											<option  value="" selected>Registre Commerce</option>
	
										</select>
									</div>
								</div>
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration">Désignation</span>
										</div>
										<input type="text" name="designation_rc" id="designation_rc" class="form-control " readonly="readonly">
	
									</div>
								</div>
	
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 76px; text-align: left;">Adresse </span>
										</div>
										<input type="text" class="form-control " name="adresse_rc"
											id="adresse_rc" value="" readonly="readonly">
									</div>
								</div>
	
							</div>
							
							<hr>
							
							<div class="row">
	
								<div class="col-md-4 column">
									
								</div>
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration">Date Debut</span>
										</div>
										<input type="date" name="date_debut" id="date_debut" class="form-control" required>
	
									</div>
								</div>
	
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 76px; text-align: left;">Date Fin </span>
										</div>
										
										<input type="date" name="date_fin" id="date_fin" class="form-control " required>
										
									</div>
								</div>
	
							</div>
							
						</div>
					</div>
	
					<hr />
	
	
					<table class="table" id="table" width="100%">
						<thead class="thead-dark">
							<tr>
								<th align="center"  width="8%">Art</th>
								<th  align="center" >Libellé</th>
								<th  align="center"  width="8%">Um</th>
								<th  align="center" >Qte</th>
							</tr>
						</thead>
	
						<tbody>
	
							<tr th:each="i : ${#numbers.sequence( 1, 10, 1)}" th:attr="id='tr'+${i}" >
	
								<td> <input class="form-control nom_art" type="text" value="" id="code_art" readonly> </td>
								
								<td> <select id="art" class="form-control selectpicker art" data-style="btn btn-outline-secondary" data-size="8" data-live-search="true" name="">
										<option value="" selected>Selection</option>
									 </select> 
								</td>
								
								<td> <input class="form-control unite_mesure" id="unite_mesure" type="text" value="" style="text-align: center;" readonly> 
										<input type="hidden" id="id_um" name="id_um" value="0" > </td>
								
								<td> <input class="form-control qte zero" id="qte" name="qte" type="number" step="any" value="" style="text-align: right;" readonly> </td>
	
							</tr>
	
						</tbody>
	
					</table>
	
				</form>
	
			</div>
		</div>
	
	</div>
	
	<script type='text/javascript'> spin_it('off'); </script>
	
	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <p id="text"></p>
	      </div>
	      <div class="modal-footer">
	        <button type="button" id="fermer" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	</body>
	
</html>
