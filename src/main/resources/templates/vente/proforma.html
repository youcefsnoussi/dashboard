<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application Commercial</title>
		
		<link rel="stylesheet" th:href="@{/resources/Plugins/bootstrap-4.3.1/css/bootstrap.min.css}">
		<link rel="stylesheet" th:href="@{/resources/Plugins/bootstrap-select-1.13.7/dist/css/bootstrap-select.min.css}">
		
		<link rel="stylesheet" th:href="@{/resources/Plugins/datatable/css/dataTables.bootstrap4.min.css}" />  
		
		<link th:href="@{/resources/Plugins/Font-Awsom-Pro-5.8.2/css/all.css}" rel="stylesheet"> 
		
		<link rel="stylesheet" th:href="@{/resources/Plugins/kartik-v-bootstrap-fileinput/css/fileinput.min.css}"/>
		
		<script  th:src="@{/resources/additionalJS/jquery-3.2.1.min.js}"></script>
		<script  th:src="@{/resources/Plugins/bootstrap-4.3.1/js/bootstrap.bundle.min.js}"></script>
		
		<script type="text/javascript" th:src="@{/resources/Plugins/datatable/js/jquery.dataTables.min.js}"></script>
		<script type="text/javascript" th:src="@{/resources/Plugins/datatable/js/dataTables.bootstrap4.min.js}"></script>
		<script type="text/javascript" th:src="@{/resources/Plugins/datatable/js_additional/sum().js}"></script>
		
		<script type="text/javascript" th:src="@{/resources/additionalJS/drahem.js}"></script>
		
		<script type="text/javascript" th:src="@{/resources/Plugins/bootstrap-select-1.13.7/dist/js/bootstrap-select.min.js}"></script>
		<script type="text/javascript" th:src="@{/resources/Plugins/bootstrap-select-1.13.7/dist/js/i18n/defaults-fr_FR.min.js}"></script>
		
		<script type="text/javascript" th:src="@{/resources/Plugins/kartik-v-bootstrap-fileinput/js/fileinput.min.js}"></script>
		
		<script type="text/javascript" th:src="@{/resources/Plugins/kartik-v-bootstrap-fileinput/js/plugins/piexif.js}"></script>
		
		<script type="text/javascript" >
		
		$(document).ready(function() {
			
			var getUrlParameter = function getUrlParameter(sParam) {
			    var sPageURL = window.location.search.substring(1),
			        sURLVariables = sPageURL.split('&'),
			        sParameterName,
			        i;

			    for (i = 0; i < sURLVariables.length; i++) {
			        sParameterName = sURLVariables[i].split('=');

			        if (sParameterName[0] === sParam) {
			            return sParameterName[1] === undefined ? true : decodeURIComponent(sParameterName[1]);
			        }
			    }
			};
			
			var getUrlParameter = function getUrlParameter(sParam) {
			    var sPageURL = window.location.search.substring(1),
			        sURLVariables = sPageURL.split('&'),
			        sParameterName,
			        i;

			    for (i = 0; i < sURLVariables.length; i++) {
			        sParameterName = sURLVariables[i].split('=');

			        if (sParameterName[0] === sParam) {
			            return sParameterName[1] === undefined ? true : decodeURIComponent(sParameterName[1]);
			        }
			    }
			};
			
			var id_prof = getUrlParameter('id_prof');
			
			var num_prof = getUrlParameter('num_prof');
			
			
			if(id_prof!=null){
				
				$('#print_content').html('<iframe id="frame" width="100%" height="828" frameborder="0" '+
						'src="print_proforma/'+id_prof+'"></iframe>');
				
				$("#title_bl").text("Détail BL N° "+num_prof);
				
				$("#icone_bl").attr("class","far fa-file-invoice");
				
				$("#proforma_modal").modal("show");
					
			}
			
			//---------------------------------- ----------------------- ---------------------------------------------
			
			$("#id_rc").val($("#id_client_rc option:selected").attr("id_rc"));
			$("#id_clt").val($("#id_client_rc option:selected").attr("id_clt"));
			$("#libelle_client").val($("#id_client_rc option:selected").text());
			
			$("#id_client_rc").on("change",function(){
				
				var nom = $("#id_client_rc option:selected").text();
				var id_clt = $("#id_client_rc option:selected").attr("id_clt");
				var id_rc = $("#id_client_rc option:selected").attr("id_rc");
				
				$("#id_rc").val(id_rc);
				$("#id_clt").val(id_clt);
				$("#libelle_client").val(nom);
				
			})
			
			$(".art").change(function(){
				
				var parrent = $(this).parent().parent().parent();
				
				var id_art =  $("option:selected", this).val();
				
				var id_rc = $("#id_rc").val();
				
				var res;
				
				$.ajaxSetup({async: false});
				$.ajax({
					url: 'get_prix_by_client',
					//type: 'POST',
					dataType: 'json',
					data : {
						id_art: id_art,
						id_rc : id_rc 
			        },
			        success : function(responseJson) {
			        	
			        	$.each(responseJson, function(key, value) {
							res = value;
			        	});
					}
				});
				
				parrent.find(".prix_unitaire").val(parseFloat(res.prix));
				
				parrent.find(".tva").val(parseFloat(res.tva.taux_tva));
				
				parrent.find(".unite_mesure").val(res.article.unite_mesure_vente.nom_unite_mesure);
				
				parrent.find(".id_um").val(res.article.unite_mesure_vente.id);
				
				parrent.find(".nom_art").val(res.article.code);
				
			});
			
			$(".qte").keyup(function(){
				
				calcule_article($(this));
				
				calcule_total()
				
			});
			
			//-----------------------------------------
			
			$(".zero").blur(function(){
				
				if($(this).val()==""){
					
					$(this).val(0);
					
				}
				
			});
			
			$(".zero").focus(function(){
				
				if($(this).val()==0){
					
					$(this).val("");
					
				}
				
			});
			
		});
		
		function calcule_article(input){
			
			var parent = $(input).parent().parent();
			
			var quant = $(input).val();
			
			var prix_u_ht = parent.find(".prix_unitaire").val();
			
			var tva = parent.find(".tva").val();
			
			var montant_ht = quant * prix_u_ht;
			
			var montant_tva = montant_ht * (tva/100);
			
			var montant_ttc = montant_ht + montant_tva;
			
			parent.find(".montant_ht").val(montant_ht.formatMoney(2, '.', ' '));
			
			parent.find(".montant_tva").val(montant_tva.formatMoney(2, '.', ' '));
			
			parent.find(".montant_ttc").val(montant_ttc.formatMoney(2, '.', ' '));
			
		}
		
		function calcule_total(){
			
			var total_ht = 0;
			var total_tva = 0;
			var total_ttc = 0;
			
			$(".montant_ht").each(function()  { total_ht += parseFloat($(this).val().replaceAll(' ', '')); });
			$(".montant_tva").each(function() { total_tva += parseFloat($(this).val().replaceAll(' ', '')); });
			$(".montant_ttc").each(function() { total_ttc += parseFloat($(this).val().replaceAll(' ', '')); });
			
			
			$("#total_ht").val(total_ht.formatMoney(2, '.', ' '));
			$("#total_tva").val(total_tva.formatMoney(2, '.', ' '));
			$("#total_ttc").val(total_ttc.formatMoney(2, '.', ' '));
			
		}
		
		</script>
		
</head>
<body>
	<br>
	<div class="container-fluid h-100">
		
		<div class="card">
		 
			<h3 class="card-header  text-center"> <i class="far fa-file-invoice"></i>  Proforma </h3>
			
			<div class="card-body">
			
				<div class="container-fluid h-100">
					
					<form id="frm" action="#"  th:action="@{/new_proforma}"  th:object="${proforma}" method="post" >
						
						<div class="card">
		
							<div class="card-header">
								
								<div class="row">
								
									<div class="col-md-3">
									
										<h5 > <i class="far fa-user-alt"></i> Client </h5>
									
									</div>
								
								</div>
								
							</div>		
							
							<br>
		
							<div class="card-body">
								
								<div class="row">
								
									<div class="col-md-3">
									
										<select id="id_client_rc" class="selectpicker" data-live-search="true" data-style="btn-outline-dark"
											th:object="${client_registreCommerce}">
										
											<option th:each="RcClt : ${clients}" th:attr="id_rc=${RcClt.registre_commerce.id},
												id_clt=${RcClt.client.id}, data-subtext=${RcClt.registre_commerce.code}"
												th:text="${RcClt.registre_commerce.nom}+' '+${RcClt.registre_commerce.prenom}"
												th:value="${RcClt.id}"></option>
										
										</select>
										
										<input type="hidden" id="id_clt" th:field="*{client}">
										<input type="hidden" id="id_rc" th:field="*{registre_commerce}">
										
									</div>
									
									<div class="col-md-4">
									
										<input type="text" class="form-control" id="libelle_client" placeholder="Libelle Client" disabled>
										
									</div>
									
								</div>
								
								<hr>
								
								<div class="row">
								
									<div class="col-md-3 offset-md-9">
									
										<div class="input-group">
											<div class="input-group-prepend">
												<span class="input-group-text declaration" style="min-width: 106px; text-align: right;"> 
												Montant HT </span>
											</div>
											<input type="text" id="total_ht" class="form-control" th:field="*{total_ht}" 
												style="text-align: right;" th:readonly="true">
										</div>
									
									</div>
									
									<div class="col-md-3 offset-md-9">
									
										<div class="input-group">
											<div class="input-group-prepend">
												<span class="input-group-text declaration" style="min-width: 106px; text-align: right;"> 
												Montant TVA </span>
											</div>
											<input type="text" id="total_tva" class="form-control" th:field="*{total_tva}" 
												style="text-align: right;" th:readonly="true">
										</div>
									
									</div>
									
									<div class="col-md-3 offset-md-9">
									
										<div class="input-group">
											<div class="input-group-prepend">
												<span class="input-group-text declaration" style="min-width: 106px; text-align: right;"> 
												Montant TTC </span>
											</div>
											<input type="text" id="total_ttc" class="form-control" th:field="*{total_ttc}" 
												style="text-align: right;" th:readonly="true">
										</div>
										
									</div>
									
								</div>
								
							</div>
							
						</div>
						
						<hr>
						
						<div class="card">
		
							<div class="card-body">
								
								<table class="table" id="table" >
									<thead class="thead-dark">
										<tr>
											<th align="center"  width="8%">Art</th>
											<th  align="center" >Libellé</th>
											<th  align="center"  width="8%">Um</th>
											<th  align="center" >Qte</th>
											<th  align="center" >PU</th>
											<th  align="center" >TVA</th>
											<th  align="center" >MONTANT HT</th>
											<th  align="center" >MONTANT TVA</th>
											<th  align="center" >MONTANT TTC</th>
										</tr>
									</thead>
				
									<tbody th:object="${ProformaDetailsDto}">
				
										<tr th:each="details, itemStat : *{ProformaDetails}" > 
				
											<td> 
												<input class="form-control nom_art" type="text" disabled> 
											</td>
											
											<td> 
												 <select class="form-control selectpicker art" data-style="btn btn-outline-secondary" data-size="8" 
												  data-live-search="true" th:field="*{ProformaDetails[__${itemStat.index}__].article}">
												  
													<option value="0" th:attr="id_um=0, des_um=0" selected>Articles</option>
													
													<option th:each="art : ${articles}" th:text="${art.libelle}" th:value="${art.id}"
														th:attr="id_um=${art.unite_mesure_vente.id},data-subtext=${art.code}, 
														des_um=${art.unite_mesure_vente.nom_unite_mesure}"></option>
													
												 </select> 
											</td>
											
											<td> <input class="form-control unite_mesure" type="text" style="text-align: center;" disabled> 
												 <input type="hidden" 
												 	class="id_um" th:field="*{ProformaDetails[__${itemStat.index}__].unite_mesure}"> </td>
											
											<td> <input class="form-control qte zero" id="qte" name="qte" type="number" step="any" value="0" 
													style="text-align: right;" th:field="*{ProformaDetails[__${itemStat.index}__].quantite}"> </td>
											
											<td><input class="form-control prix_unitaire" type="number" step="any" readonly  
													style="text-align: right;" th:field="*{ProformaDetails[__${itemStat.index}__].prix_u_ht}"> </td>
											
											<td><input class="form-control tva" type="number" step="any" style="text-align: right;" readonly 
													th:field="*{ProformaDetails[__${itemStat.index}__].tva}"> </td>
											
											<td><input class="form-control montant_ht"  type="text" style="text-align: right;" readonly 
													th:field="*{ProformaDetails[__${itemStat.index}__].montant_ht}"> </td>
											
											<td><input class="form-control montant_tva"  type="text" style="text-align: right;" readonly
													th:field="*{ProformaDetails[__${itemStat.index}__].montant_tva}"> </td>
											
											<td><input class="form-control montant_ttc"  type="text" style="text-align: right;" readonly
													th:field="*{ProformaDetails[__${itemStat.index}__].montant_ttc}"> </td>
											
										</tr>
				
									</tbody>
				
								</table>
								
							</div>
							
						</div>
						
						<hr>
						
						<div class="d-flex justify-content-center">
						
							<input id="sub" type="submit" class="btn btn-primary" value="Valider">
						
						</div>
					
					</form>
					
				</div>
					
				
			</div>
			
		</div>
		
	</div>
	
	<!-- ------------------------------------------------------------------------------ -->
	
	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <p id="text"></p>
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	<!-- ------------------------------------------------------------------------------ -->
	<div id="proforma_modal" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	      		
	      		<input type="hidden" id="id_facture">
	      		
	      		<div class="col-md-6">
	      			
	      			<div class="input-group">
	      				<div class="input-group-prepend">
	      					<i id="icone_bl" class="far fa-file-invoice" style="font-size:30px;margin-right:10px;" ></i>
	      				</div>	
	      					<h5 id="title_bl" class="modal-title" > </h5>
			        </div>	
	      		</div>
	      	<button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      	
	      </div>
	      
	      <div class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;" id="print_content" >
	         
	      </div>
	      
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	      
	    </div>
	  </div>
	</div>
	<!-- ---------------------------------------------------------- ------ ----------- -->
	
	
	
</body>
</html>
