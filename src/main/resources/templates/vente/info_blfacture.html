<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Insert title here</title>
	
	
	<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
	<link rel="stylesheet" href="resources\Plugins\datatable\css\dataTables.bootstrap.min.css">
	<link href="resources\Plugins\jAlert-master\dist\jAlert.css" rel="stylesheet">
	<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet">
	<link href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css" rel="stylesheet"> 
	
	<script type="text/javascript" src="resources\additionalJS\jquery-3.2.1.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
	<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
	
	<script type="text/javascript" src="resources\additionalJS\jquery-spin.js"></script>
	<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
	<script type="text/javascript" src="resources\additionalJS\spin.js"></script>  
	
	<script type="text/javascript">
	
	$(document).ready(function() {
		
		$("#subsub").click(function() {
			
			var t_ttc = $("#total_ttc").val().replace(" ","");
			
			console.log($("#total_ttc").val()+" / conv = "+t_ttc);
			
			if(parseFloat(t_ttc)==0){
				
				$("#title").text("Erreur !!!");
				$("#icone").attr("class","far fa-exclamation-triangle");
				$("#text").html("<span> Pas de bons de sorties non facturé durant cette periode !!! <span>");
				$("#error").modal('show');
				
			}
			else{
				
				$("#text_confirmation").html("Etes vous sure de facturée les bons de Livraisons selectionner ?");

				$("#confirmation").modal('show');
				
			}
		});
		
		$("#confirm").click(function() {
			
			$("#frm").submit();
			
		});
		
	});
	
	
	
	</script>
	
	</head>

	<body >
	
	<!-- ---------------------------------------- -->
	
	<script type='text/javascript'> spin_it('on'); </script>
	
	<!-- ---------------------------------------- -->
	
	<div class="container-fluid h-100">
	
		<div class="card">
			<!--  
			<h3 class="card-header  text-center">
				<i class="far fa-file-invoice"></i> Facture <button type="button" id="sub" class="btn btn-success">Enregistrer</button>
			</h3>
			
			<br>
			-->
			<div class="card-body">
			
				<form id="frm" th:action="@{/facture_blf_post}" method="post" style="height: 100%" autocomplete="off">
				
					<div class="card" >
	
						<h5 class="card-header "> <i class="far fa-user-alt"></i> Client </h5>
						<br>
	
						<div class="card-body">
							
							<input type="hidden" id="date_d" name="date_d" th:value="${date_d}">
							
							<input type="hidden" id="date_f" name="date_f" th:value="${date_f}">
							
							<input type="hidden" id="rc_clt" name="id_rel_rc_clt" th:value="${rc_clt.id}">
							
							<div class="row">
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration">Désignation</span>
										</div>
										<input type="text" name="designation_rc" id="designation_rc" class="form-control" 
										th:value="${rc_clt.registre_commerce.nom}+' '+${rc_clt.registre_commerce.prenom}" readonly>
									</div>
								</div>
	
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 76px; text-align: left;">Adresse </span>
										</div>
										<input type="text" class="form-control " name="adresse_rc" id="adresse_rc" 
										th:value="${rc_clt.registre_commerce.adresse}" readonly>
									</div>
								</div>
	
							</div>
	
							<hr>
							
							<div class="col-md-4 offset-md-8">
								<div class="input-group">
									<div class="input-group-prepend">
										<span class="input-group-text declaration" style="min-width: 106px; text-align: left;"> Montant HT </span>
									</div>
									<input type="text" class="form-control " name="total_ht" style="text-align: right;" id="total_ht" 
										th:value="${#numbers.formatDecimal(montant_ht, 3, 'WHITESPACE', 2,'COMMA')}" readonly>
								</div>
							</div>
	
	
							<div class="col-md-4 offset-md-8">
								<div class="input-group">
									<div class="input-group-prepend">
										<span class="input-group-text declaration">Montant TVA</span>
									</div>
									<input type="text" class="form-control " name="total_tva" style="text-align: right;" id="total_tva" 
										th:value="${#numbers.formatDecimal(montant_tva, 3, 'WHITESPACE', 2,'COMMA')}" readonly>
								</div>
							</div>
	
	
							<div class="col-md-4 offset-md-8">
								<div class="input-group">
									<div class="input-group-prepend">
										<span class="input-group-text declaration">Montant TTC </span>
									</div>
									<input type="text" class="form-control " name="total_ttc" style="text-align: right;" id="total_ttc" 
										th:value="${#numbers.formatDecimal(montant_ttc, 3, 'WHITESPACE', 2,'COMMA')}" readonly>
								</div>
							</div>
	
	
						</div>
					</div>
	
					<hr />
	
	
					<table class="table" id="table" >
						<thead class="thead-dark">
							<tr>
								<th align="center"  width="8%">Art</th>
								<th  align="center" width="40%">Libellé</th>
								<th  align="center" >Um</th>
								<th  align="center" >Qte</th>
								<th  align="center" >PU</th>
								<th  align="center" >TVA</th>
								<th  align="center" >MONTANT HT</th>
							</tr>
						</thead>
	
						<tbody>
	
							<tr th:each="det:${cumule_ble}" >
	
								<td> <input class="form-control nom_art" type="text" th:value="${det.article.code}" id="code_art" readonly> </td>
								
								<td> 
									<input class="form-control nom_art" type="text" id="art" name="art" readonly
										th:value="${det.article.libelle}" > 
								</td>
								
								<td> <input class="form-control unite_mesure" id="unite_mesure" type="text" value="" style="text-align: center;"
												th:value="${det.article.unite_mesure_vente.nom_unite_mesure}" readonly> 
								</td>
								
								<td> <input class="form-control qte zero" id="qte" name="qte" type="text" th:value="${#numbers.formatDecimal(det.quantite, 2, 'WHITESPACE', 2,'COMMA')}" 
										style="text-align: right;" readonly> </td>
								
								<td><input class="form-control prix_unitaire" id="prix_unitaire" name="prix_unitaire" 
										th:value="${det.prix_u_ht}" type="number" step="any" style="text-align: right;" readonly> </td>
								
								<td><input class="form-control tva" id="tva" name="tva_art" type="number" th:value="${det.tva}" 
										step="any" value="" style="text-align: right;" readonly> </td>
								
								<td><input class="form-control montant_ht" id="montant_ht" name="montant_ht_art" 
										th:value="${#numbers.formatDecimal(det.montant_ht, 3, 'WHITESPACE', 2,'COMMA')}" type="text" style="text-align: right;" readonly> </td>
	
							</tr>
	
						</tbody>
	
					</table>
					
					<hr>
					
					<div class="d-flex justify-content-center">
						
						<button type="button" id="subsub" class="btn btn-success">Valider</button>
					
					</div>
					
				</form>
				
			</div>
		</div>
	
	</div>
	
	<script type='text/javascript'> spin_it('off'); </script>
	
	<!-- ------------------------------------------------------------------------------------------------------------------------------------------------- -->
	
	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <p id="text"></p>
	      </div>
	      <div class="modal-footer">
	        <button type="button" id="fermer" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	<!-- ------------------------------------------------------------------------------------------------------------------------------------------------- -->
	
	<div id="confirmation" class="modal fade bd-example-modal-sm" tabindex="-1" role="dialog" aria-labelledby="mySmallModalLabel" aria-hidden="true">
	  <div class="modal-dialog modal-dialog-centered"  role="document">
	  	
	    <div class="modal-content">
	      
	      <div class="modal-header">
	        <i id="icone" class="far fa-exclamation-triangle" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title">Attention</h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      
	      <div class="modal-body">
	        <p id="text_confirmation"></p>
	      </div>
	      
	      <div class="modal-footer justify-content-center">
	      	<button id="confirm" type="button" class="btn btn-primary">OUI</button>
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">NON</button>
	      </div>
	      
	    </div>
	    
	  </div>
	</div>
	
	<!-- ------------------------------------------------------------------------------------------------------------------------------------------------- -->
	
	</body>
	
</html>
