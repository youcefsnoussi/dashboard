<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application Commercial</title>
		
		<link rel="stylesheet" th:href="@{/resources/Plugins/bootstrap-4.3.1/css/bootstrap.min.css}">
		<link rel="stylesheet" th:href="@{/resources/Plugins/bootstrap-select-1.13.7/dist/css/bootstrap-select.min.css}">
		
		<link rel="stylesheet" th:href="@{/resources/Plugins/datatable/css/dataTables.bootstrap4.min.css}" />  
		
		<link th:href="@{/resources/Plugins/Font-Awsom-Pro-5.8.2/css/all.css}" rel="stylesheet"> 
		
		<link rel="stylesheet" th:href="@{/resources/Plugins/kartik-v-bootstrap-fileinput/css/fileinput.min.css}"/>
		
		<script  th:src="@{/resources/additionalJS/jquery-3.2.1.min.js}"></script>
		<script  th:src="@{/resources/Plugins/bootstrap-4.3.1/js/bootstrap.bundle.min.js}"></script>
		
		<script type="text/javascript" th:src="@{/resources/Plugins/datatable/js/jquery.dataTables.min.js}"></script>
		<script type="text/javascript" th:src="@{/resources/Plugins/datatable/js/dataTables.bootstrap4.min.js}"></script>
		<script type="text/javascript" th:src="@{/resources/Plugins/datatable/js_additional/sum().js}"></script>
		
		<script type="text/javascript" th:src="@{/resources/additionalJS/drahem.js}"></script>
		
		<script type="text/javascript" th:src="@{/resources/Plugins/bootstrap-select-1.13.7/dist/js/bootstrap-select.min.js}"></script>
		<script type="text/javascript" th:src="@{/resources/Plugins/bootstrap-select-1.13.7/dist/js/i18n/defaults-fr_FR.min.js}"></script>
		
		<script type="text/javascript" th:src="@{/resources/Plugins/kartik-v-bootstrap-fileinput/js/fileinput.min.js}"></script>
		
		<script type="text/javascript" th:src="@{/resources/Plugins/kartik-v-bootstrap-fileinput/js/plugins/piexif.js}"></script>
		
		<script type="text/javascript" >
		
		$(document).ready(function() {
			
			var datatable_config = {
					"language": {
				            "url": "resources/Plugins/datatable/lang/French.json"
				    },
					"ordering": true,
			    	"bPaginate": false,
					"scrollY":"600px",
					"scrollX": "auto",
			        "deferRender": true,
			        initComplete: function () {
			            this.api().columns([2,3]).every( function () {
			                var column = this;
			                var select = $('<select class="selectpicker show-tick" data-width="fit" data-style="btn btn-outline-secondary" '+ 
			                				'data-live-search="true" data-container="body"><option value="">Tout</option></select>')
			                    .appendTo( $(column.footer()).empty() )
			                    .on( 'change', function () {
			                        var val = $.fn.dataTable.util.escapeRegex(
			                            $(this).val()
			                        );
			 
			                        column
			                            .search( val ? '^'+val+'$' : '', true, false )
			                            .draw();
			                    } );
			 
			                column.data().unique().sort().each( function ( d, j ) {
			                    select.append( '<option value="'+d+'">'+d+'</option>' )
			                } );
			                $('.selectpicker').selectpicker('refresh');
			            } );
			        },
					 drawCallback: function () {
						
					      var api = this.api();
					      
					      $( api.column( 4, {page:'current'} ).footer() ).html(
					        api.column( 4, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					      $( api.column( 5, {page:'current'} ).footer() ).html(
					        api.column( 5, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					      $( api.column( 6, {page:'current'} ).footer() ).html(
					        api.column( 6, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					 },
		    };
		 		
		 	var table = $('#table').DataTable(datatable_config);
			
			$("#afficher").click(function(){
				
				var start = $("#debut").val();
				
				var end = $("#fin").val();
				
				if(start=="" || end==""){
					
					$("#title").text("Erreur !!!");
					$("#icone").attr("class","far fa-exclamation-triangle");
					$("#text").html("<span> Veuillez selectionner les dates !!! <span>");
					$("#error").modal('show');
					
				}
				else{
					
					//console.log("start = "+start+" / end = "+end);
					window.location.replace("list_proforma?date_debut="+start+"&date_fin="+end);
					
				}
				
			});
			
			$(".print").click(function(){
				
				var id_prof = $(this).attr("id_prof");
				
				var num_prof = $(this).attr("num_prof");
				
				$('#print_content').html('<iframe id="frame" width="100%" height="828" frameborder="0" '+
						'src="print_proforma/'+id_prof+'"></iframe>');
				
				$("#title_fact").text("Détail proforma N° "+num_prof);
				
				$("#icone_fact").attr("class","far fa-file-invoice");
				
				$("#proforma_detail_modal").modal("show");
				
			});
			
		});
		
		</script>
		
		<link rel="stylesheet" th:href="@{/resources/additionalCSS/app-theme.css?v=20260902c}">
		<script th:src="@{/resources/additionalJS/app-theme.js?v=20260902c}"></script>
</head>
<body>
	<br>
	<div class="container-fluid h-100"> <!-- container h-100 -->
		
		<div class="card ">
		
			
			<h3 class="card-header  text-center"> <i class="far fa-clipboard-list-check"></i>  List des Proformas </h3>
			<br>
			
			<div class="card-body">
			
				<div class="container-fluid">
					
					<div class="row">
						 
						<div class="col-md-3" >
						
							<div class="input-group">
								
								<input id="debut" type="date" name="start" th:value="${date_d}"  class="form-control date" 
									style="" placeholder="DU">
									
								<span class="input-group-text declaration"><i class="far fa-calendar-alt"></i> </span>
								
								<input id="fin" type="date" name="end" th:value="${date_f}" class="form-control date" 
								style="" placeholder="AU">
								
								<button id="afficher" name="afficher" class="btn btn-dark" type="button">Afficher</button>
									
							</div>
							
						</div>
						
					</div>
					
					<hr>
					
					<table id="table" class="table table-bordered table-hover" style="width:100%"> 
					
						<thead class="thead-dark">
						
							<tr>
							
								<th>N°</th>
								<th>Date</th>
								<th>Code</th>
								<th>Client</th>
								<th>Montant HT</th>
								<th>Montant TVA</th>
								<th>Montant TTC</th>
								<th>Visualiser</th>
								
							</tr>
						
						</thead>
						
						<tbody>
						
							<tr th:each="prof:${list_proforma}" >
							
								<td th:text="${prof.numero}"></td>
								<td th:text="${prof.date}"></td>
								<td th:text="${prof.registre_commerce.code}"></td>
								<td th:text="${prof.registre_commerce.nom}+' '+${prof.registre_commerce.prenom}"></td>
								<td th:text="${#numbers.formatDecimal(prof.total_ht, 3, 'WHITESPACE', 2,'POINT')}" class="rr"></td>
								<td th:text="${#numbers.formatDecimal(prof.total_tva, 3, 'WHITESPACE', 2,'POINT')}" class="rr"></td>
								<td th:text="${#numbers.formatDecimal(prof.total_ttc, 3, 'WHITESPACE', 2,'POINT')}" class="rr"></td>
								<td style="text-align: center;"> <button type="button" class="btn btn-info print" 
																 	th:attr="id_prof=${prof.id},num_prof=${prof.numero}"> 
																						<i class="far fa-print"></i>
																 </button>  
								</td>
								
							</tr>
							
						</tbody>
						
						<tfoot class="thead-dark">
						
							<tr>
							
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th class="rr"></th>
								<th class="rr"></th>
								<th class="rr"></th>
								<th></th>
								
							</tr>
						
						</tfoot>
						
					</table>
				
				</div>
			
			</div>
			
		</div>
		
	</div> 
	
	<div id="proforma_detail_modal" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	      		
      		<div class="col-md-6">
      			
      			<div class="input-group">
      				<div class="input-group-prepend">
      					<i id="icone_fact" class="far fa-file-invoice" style="font-size:30px;margin-right:10px;" ></i>
      				</div>	
      					<h5 id="title_fact" class="modal-title" > </h5>
		        </div>	
      		</div>
	      	
	      	<button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      	
	      </div>
	      
	         <div class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;" id="print_content">
	         
	         	<!-- <iframe id="frame" width="100%" height="100%" onload="ifrhgh()" frameborder="0" src="/new_payment"></iframe> -->
	         
	         </div>
	      
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	      
	    </div>
	  </div>
	</div>
	
	<!-- ---------------------------------------------------------- ------ ----------------------------------------------------------------------------------- -->
	
	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <p id="text"></p>
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	<!-- ------------------------------------------------------------------------------------------------------------------------------------------------- -->
	
	<div id="confirmation" class="modal fade bd-example-modal-sm" tabindex="-1" role="dialog" aria-labelledby="mySmallModalLabel" aria-hidden="true">
	  <div class="modal-dialog modal-dialog-centered"  role="document">
	  	
	    <div class="modal-content">
	      
	      <div class="modal-header">
	        <i id="icone" class="far fa-exclamation-triangle" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title">Attention</h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      
	      <div class="modal-body">
	        <p id="text_confirmation"></p>
	      </div>
	      
	      <div class="modal-footer justify-content-center">
	      	<button id="confirm" type="button" class="btn btn-primary">OUI</button>
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">NON</button>
	      </div>
	      
	    </div>
	    
	  </div>
	</div>
	
	<!-- ------------------------------------------------------------------------------------------------------------------------------------------------- -->
	
</body>
</html>
