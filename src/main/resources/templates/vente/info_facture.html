<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Insert title here</title>
	
	
	<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
	<link rel="stylesheet" href="resources\Plugins\datatable\css\dataTables.bootstrap.min.css">
	<link href="resources\Plugins\jAlert-master\dist\jAlert.css" rel="stylesheet">
	<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet">
	<link href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css" rel="stylesheet"> 
	
	<script type="text/javascript" src="resources\additionalJS\jquery-3.2.1.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
	<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap.min.js"></script>
	
	<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
	
	<script type="text/javascript" src="resources\additionalJS\jquery-spin.js"></script>
	<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
	<script type="text/javascript" src="resources\additionalJS\spin.js"></script>  
	
	<script type="text/javascript">
	
	$(document).ready(function() {
		
		var info = $("#info_av").val();
		
		if(info=="true"){
			
			$("#title").text("Erreur !!!");
			$("#icone").attr("class","far fa-exclamation-triangle");
			$("#text").text("Une facture d'avoire est déja établie !!!");
			$("#error").modal('show');
			
		}
		
		$("#edit_matricule").click(function() {
			
			let matricule = $("#matricule").val();
			let id_facture = $("#id_facture").val();
			
			$.ajax({
	 			url : 'update_matricule_facture',
	 			data : {
	 				id_facture : id_facture,
	 				matricule : matricule
	 			},
	 			success : function(responseJson) {
	 				
	 				$("#title").text("Information");
					$("#icone").attr("class","far fa-info-circle");
					
					$("#text").text("Modification Effectuer avec succes ");
					
					$("#error").modal('show');
	 				
	 			}
	 		});
			
		});
		
	});
	
	</script>
	
		<link rel="stylesheet" href="resources\additionalCSS\app-theme.css?v=20260902c">
		<script src="resources\additionalJS\app-theme.js?v=20260902c"></script>
	</head>

	<body >
	
	<!-- ---------------------------------------- -->
	
	<script type='text/javascript'> spin_it('on'); </script>
	
	<!-- ---------------------------------------- -->
	<br>
	<div class="container-fluid h-100">
	
		<div class="card">
			<!--  
			<h3 class="card-header  text-center">
				<i class="far fa-file-invoice"></i> Facture <button type="button" id="sub" class="btn btn-success">Enregistrer</button>
			</h3>
			
			<br>
			-->
			<div class="card-body">
					
					<input type="hidden" id="info_av" th:value="${avoir}">
					<input type="hidden" id="id_facture" th:value="${facture.id}">
					
					<div class="card" >
	
						<h5 class="card-header "> <i class="far fa-user-alt"></i> Client </h5>
						<br>
	
						<div class="card-body">
	
							<div class="row">
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 76px; text-align: left;">Code </span>
										</div>
										<input type="text" class="form-control  code_client"
											name="code_rc" id="code_rc" th:value="${facture.registre_commerce.code}" disabled>
	
									</div>
								</div>
								<input type="hidden" class="form-control" id="lib_client"
									name="lib_client" value="">
	
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration">Désignation</span>
										</div>
										<input type="text" name="designation" id="designation" class="form-control " 
												th:value="${facture.client.nom}+' '+${facture.client.prenom}" disabled>
	
									</div>
								</div>
								
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration">Date</span>
										</div>
										<input type="text" name="date" id="date" class="form-control " 
												th:value="${facture.date}" disabled>
	
									</div>
								</div>
								
							</div>
	
							<hr>
	
							<div class="row">
	
								<div class="col-md-6 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 130px; text-align: left;">Mode règelment </span>
										</div>
										<input th:if="${facture.mode_paiement}!=null" type="text" class="form-control " name="mode_reg" id="mode_reg"
											th:value="${facture.mode_paiement.designation}"  disabled>
										
										<input th:unless="${facture.mode_paiement}!=null" type="text" class="form-control " name="mode_reg" id="mode_reg"
											th:value="''"  disabled>
										
									</div>
								</div>
	
								<div class="col-md-6 column">
								
									<div class="input-group align-items-center" >
									
										<span class="input-group-text declaration"
											style="min-width: 130px; text-align: left;">Matricule</span>
											
										<div class="input-group-append" th:if="${edit_matricule}==true" style="width:80%;">
											<input type="text" class="form-control" name="matricule" id="matricule" 
												th:value="${facture.matricule_camion}" placeholder="xxxxxx-xxx-xx"> 
											<input type="button" class="btn btn-success" id="edit_matricule" value="Modifier">
										</div>		
										
										<div class="input-group-append" th:unless="${edit_matricule}==true" style="width:80%;">
											<input type="text" class="form-control" name="matricule" id="matricule" 
												th:value="${facture.matricule_camion}" disabled> 
										</div>
									</div>
									
									
								</div>
	
							</div>
	
							<hr>
	
							<div class="row">
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 130px; text-align: left;">RC </span>
										</div>
										
										<input type="text" class="form-control" name="num_rc" id="num_rc" th:value="${facture.registre_commerce.numero_rc}" disabled > 
										
									</div>
								</div>
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration">Désignation</span>
										</div>
										<input type="text" name="designation_rc" id="designation_rc" class="form-control" 
														th:value="${facture.registre_commerce.nom}+' '+${facture.registre_commerce.prenom}" disabled>
	
									</div>
								</div>
	
	
								<div class="col-md-4 column">
									<div class="input-group">
										<div class="input-group-prepend">
											<span class="input-group-text declaration"
												style="min-width: 76px; text-align: left;">Adresse </span>
										</div>
										<input type="text" class="form-control " name="adresse_rc"
											id="adresse_rc" th:value="${facture.registre_commerce.adresse}" disabled>
									</div>
								</div>
	
							</div>
	
							<hr>
							
							<div class="row">
							
								<div class="col-md-7 ">
										<!--  
										<div class="input-group">
							
											<h5>Réduction sur les articles :</h5><h5 id="redux">  </h5>
										
										</div>
										-->
										<label>Observation</label>
										
										<textarea rows="3" cols="" id="observation" class="form-control" name="observation" 
											th:if="${facture.bon_livraison}!=null" th:text="${facture.bon_livraison.commande.observation}" 
												disabled></textarea>
												
										<textarea rows="3" cols="" id="observation" class="form-control" name="observation" 
											th:unless="${facture.bon_livraison}!=null" disabled></textarea>		
										
								</div>
								
								<div class="col-md-4 offset-md-1">
								
									<div class="row">
									
										<div class="col-md-12">
											<div class="input-group">
												<div class="input-group-prepend">
													<span class="input-group-text declaration" style="min-width: 106px; text-align: left;"> Montant HT </span>
												</div>
												<input type="text" class="form-control " name="total_ht" style="text-align: right;" id="total_ht" 
													th:value="${#numbers.formatDecimal(facture.montant_ht, 3, 'WHITESPACE', 2,'COMMA')}" disabled>
											</div>
										</div>
									
									</div>
									
									<div class="row">
									
										<div class="col-md-12">
											<div class="input-group">
												<div class="input-group-prepend">
													<span class="input-group-text declaration">Montant Remise</span>
												</div>
												<input type="text" class="form-control " name="total_remise" style="text-align: right;" id="total_remise" 
													th:value="${#numbers.formatDecimal(facture.montant_remise, 3, 'WHITESPACE', 2,'COMMA')}" disabled>
											</div>
										</div>
									
									</div>
									
									<div class="row">
									
										<div class="col-md-12">
											<div class="input-group">
												<span class="input-group-text declaration">Montant HT NET</span>
												<input type="text" class="form-control " name="total_ht_net" style="text-align: right;" id="total_ht_net" 
												th:value="${#numbers.formatDecimal(facture.montant_ht_net, 3, 'WHITESPACE', 2,'COMMA')}" disabled>
											</div>
										</div>
									
									</div>
									
									<div class="row">
									
										<div class="col-md-12">
											<div class="input-group">
												<div class="input-group-prepend">
													<span class="input-group-text declaration">Montant TVA</span>
												</div>
												<input type="text" class="form-control " name="total_tva" style="text-align: right;" id="total_tva" 
													th:value="${#numbers.formatDecimal(facture.montant_tva, 3, 'WHITESPACE', 2,'COMMA')}" disabled>
											</div>
										</div>
									
									</div>
									
									<div class="row">
									
										<div class="col-md-12">
											<div class="input-group">
												<div class="input-group-prepend">
													<span class="input-group-text declaration">Montant TTC </span>
												</div>
												<input type="text" class="form-control " name="total_ttc" style="text-align: right;" id="total_ttc" 
													th:value="${#numbers.formatDecimal(facture.montant_ttc, 3, 'WHITESPACE', 2,'COMMA')}" disabled>
											</div>
										</div>	
									
									</div>
								
								</div>
								
							</div>
								
						</div>
					</div>
	
					<hr />
	
	
					<table class="table" id="table" >
						<thead class="thead-dark">
							<tr>
								<th align="center" width="5.5%">Art</th>
								<th align="center" width="20%">Libellé</th>
								<th align="center" >Um</th>
								<th align="center" >Qte</th>
								<th align="center" >PU</th>
								<th align="center" >Montant HT</th>
								<th align="center" >Remise (Valeur/%)</th>
								<th align="center" >Montant HT NET</th>
								<th align="center" >TVA</th>
								<th align="center" >Montant TVA</th>
								<th align="center" >Montant TTC</th>
								
							</tr>
						</thead>
	
						<tbody>
	
							<tr th:each="fact_det:${detail_facture}" >
	
								<td> <input class="form-control nom_art" type="text" th:value="${fact_det.article.code}" id="code_art" disabled> </td>
								
								<td> 
									<input class="form-control nom_art" type="text" id="art" name="art" disabled
										th:value="${fact_det.article.libelle}" > 
								</td>
								
								<td> <input class="form-control unite_mesure" id="unite_mesure" type="text" value="" style="text-align: center;"
												th:value="${fact_det.article.unite_mesure_vente.nom_unite_mesure}" disabled> 
								</td>
								
								<td> <input class="form-control qte zero" id="qte" name="qte" type="number" step="any" th:value="${fact_det.quantite}" style="text-align: right;" disabled> </td>
								
								<td><input class="form-control prix_unitaire" id="prix_unitaire" name="prix_unitaire" th:value="${fact_det.prix_u_ht}" type="number" step="any" style="text-align: right;" disabled> </td>
								
								<td><input class="form-control montant_ht" id="montant_ht" name="montant_ht_art" th:value="${#numbers.formatDecimal(fact_det.montant_ht, 3, 'WHITESPACE', 2,'COMMA')}" type="text" style="text-align: right;" disabled> </td>
								
								<td> 
									<div class="input-group">
									
										<input class="form-control montant_remise" id="montant_remise" name="montant_remise" th:value="${#numbers.formatDecimal(fact_det.montant_remise, 3, 'WHITESPACE', 2,'COMMA')}" type="text" style="text-align: right;" disabled>
										<input class="form-control pourcentage_remise" id="pourcentage_remise" name="pourcentage_remise" th:value="${#numbers.formatDecimal(fact_det.pourcentage_remise, 3, 'WHITESPACE', 2,'COMMA')}" type="text" style="text-align: right;" disabled>
										
									</div>
								</td>
								
								<td><input class="form-control montant_ht_net" id="montant_ht_net" name="montant_ht_art_net" th:value="${#numbers.formatDecimal(fact_det.montant_ht_net, 3, 'WHITESPACE', 2,'COMMA')}" type="text" style="text-align: right;" disabled> </td>
								
								<td><input class="form-control tva" id="tva" name="tva_art" type="number" th:value="${fact_det.tva}" step="any" value="" style="text-align: right;" disabled> </td>
								
								<td><input class="form-control montant_tva" id="montant_tva" name="montant_tva" th:value="${#numbers.formatDecimal(fact_det.montant_tva, 3, 'WHITESPACE', 2,'COMMA')}" type="text" style="text-align: right;" disabled> </td>
								
								<td><input class="form-control montant_ttc" id="montant_ttc" name="montant_ttc" th:value="${#numbers.formatDecimal(fact_det.montant_ttc, 3, 'WHITESPACE', 2,'COMMA')}" type="text" style="text-align: right;" disabled> </td>
								
							</tr>
	
						</tbody>
	
					</table>
	
			</div>
		</div>
	
	</div>
	
	<script type='text/javascript'> spin_it('off'); </script>
	
	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <label id="text"></label>
	      </div>
	      <div class="modal-footer">
	        <button type="button" id="fermer" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	</body>
	
</html>
