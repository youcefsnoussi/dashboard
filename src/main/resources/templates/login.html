<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Connexion — Application Commercial</title>
	<link rel="icon" href="resources/images/commerce.png">

	<style>
		:root{
			--ink-1:#131a26;
			--ink-2:#4d5769;
			--ink-3:#8792a6;
			--surface:#ffffff;
			--field:#f4f6fa;
			--border:#e2e8f1;
			--primary:#2a78d6;
			--primary-dark:#1f61b0;
			--danger:#d03b3b;
			--danger-soft:#fdecec;
			--good:#0a8a43;
			--good-soft:#e6f6ed;
		}
		*{box-sizing:border-box;}
		html,body{height:100%;margin:0;}
		body{
			font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
			color:var(--ink-1);
			display:flex;align-items:center;justify-content:center;
			min-height:100vh;min-height:100dvh;padding:24px;
			-webkit-font-smoothing:antialiased;
			position:relative;overflow:hidden;
			background:#0f1723;
		}
		/* soft depth behind the card, nothing distracting */
		body::before,body::after{
			content:"";position:absolute;border-radius:50%;filter:blur(90px);
			pointer-events:none;z-index:0;
		}
		body::before{
			width:520px;height:520px;top:-180px;right:-120px;
			background:rgba(42,120,214,.42);
		}
		body::after{
			width:460px;height:460px;bottom:-190px;left:-120px;
			background:rgba(27,175,122,.28);
		}

		/* ---------- the card ---------- */
		.card{
			position:relative;z-index:1;
			width:100%;max-width:410px;
			background:var(--surface);
			border-radius:20px;
			padding:38px 38px 30px;
			box-shadow:0 24px 70px rgba(6,12,22,.42), 0 2px 8px rgba(6,12,22,.22);
			animation:rise .45s cubic-bezier(.22,.61,.36,1) both;
		}
		@keyframes rise{
			from{opacity:0;transform:translateY(14px);}
			to  {opacity:1;transform:none;}
		}

		.head{text-align:center;margin-bottom:26px;}
		.head img{height:78px;width:auto;display:block;margin:0 auto 18px;}
		.head h1{font-size:21px;font-weight:730;letter-spacing:-.02em;margin:0 0 5px;}
		.head p{margin:0;font-size:13.5px;color:var(--ink-2);}

		/* ---------- fields ---------- */
		.field{margin-bottom:15px;}
		.field label{
			display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);
			margin-bottom:7px;
		}
		.input-wrap{position:relative;display:flex;align-items:center;}
		.input-wrap .lead{
			position:absolute;left:14px;color:var(--ink-3);pointer-events:none;
			display:flex;transition:color .15s ease;
		}
		.input-wrap input{
			width:100%;font:inherit;font-size:15px;color:var(--ink-1);
			background:var(--field);border:1.5px solid transparent;
			border-radius:12px;padding:13px 14px 13px 43px;min-height:50px;
			transition:border-color .16s ease,background .16s ease,box-shadow .16s ease;
		}
		.input-wrap input::placeholder{color:var(--ink-3);}
		.input-wrap input:focus{
			outline:none;background:var(--surface);border-color:var(--primary);
			box-shadow:0 0 0 4px rgba(42,120,214,.13);
		}
		.input-wrap:focus-within .lead{color:var(--primary);}
		.input-wrap .peek{
			position:absolute;right:8px;width:36px;height:36px;border:0;background:none;
			color:var(--ink-3);cursor:pointer;border-radius:9px;
			display:flex;align-items:center;justify-content:center;
			transition:background .15s ease,color .15s ease;
		}
		.input-wrap .peek:hover{background:var(--field);color:var(--ink-1);}
		#inputPassword{padding-right:50px;}

		/* ---------- submit ---------- */
		.submit{
			width:100%;font:inherit;font-size:15px;font-weight:650;color:#fff;
			background:var(--primary);border:0;border-radius:12px;
			min-height:50px;margin-top:10px;cursor:pointer;
			display:flex;align-items:center;justify-content:center;gap:9px;
			box-shadow:0 4px 16px rgba(42,120,214,.32);
			transition:background .16s ease,transform .1s ease,box-shadow .16s ease;
		}
		.submit:hover{background:var(--primary-dark);box-shadow:0 6px 20px rgba(42,120,214,.4);}
		.submit:active{transform:scale(.985);}
		.submit .sp{
			width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
			border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;
			display:none;
		}
		.submit.busy .sp{display:block;}
		@keyframes rot{to{transform:rotate(360deg)}}

		/* ---------- messages ---------- */
		.alert{
			display:flex;align-items:flex-start;gap:10px;
			padding:12px 14px;border-radius:12px;font-size:13.5px;font-weight:550;
			margin-bottom:18px;line-height:1.45;
		}
		.alert svg{flex:none;margin-top:1px;}
		.alert.err{background:var(--danger-soft);color:#8f2323;}
		.alert.ok{background:var(--good-soft);color:#0a6d38;}

		.foot{
			margin-top:24px;padding-top:18px;border-top:1px solid var(--border);
			font-size:12px;color:var(--ink-3);text-align:center;
		}

		@media (max-width:420px){
			.card{padding:30px 24px 24px;border-radius:16px;}
			.head img{height:64px;}
		}
		@media (prefers-reduced-motion: reduce){
			*{animation-duration:.01ms !important;transition-duration:.01ms !important;}
		}
	</style>
</head>
<body>

	<div class="card">

		<div class="head">
			<img src="resources/images/login/sim.png" alt="SIM">
			<h1>Application Commercial</h1>
			<p>Connectez-vous pour continuer</p>
		</div>

		<div class="alert err" th:if="${param.error}">
			<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5m0 3.5h.01"/></svg>
			<span>Nom d’utilisateur ou mot de passe incorrect.</span>
		</div>

		<div class="alert ok" th:if="${param.out}">
			<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5 11 15l4.5-5"/></svg>
			<span>Vous êtes déconnecté.</span>
		</div>

		<form id="frm" th:action="@{/login}" method="post" autocomplete="off">

			<div class="field">
				<label for="inputUsername">Nom d’utilisateur</label>
				<div class="input-wrap">
					<span class="lead">
						<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
					</span>
					<input type="text" id="inputUsername" name="username"
						   placeholder="Votre identifiant" required autofocus
						   autocapitalize="off" spellcheck="false">
				</div>
			</div>

			<div class="field">
				<label for="inputPassword">Mot de passe</label>
				<div class="input-wrap">
					<span class="lead">
						<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
					</span>
					<input type="password" id="inputPassword" name="password"
						   placeholder="Votre mot de passe" required>
					<button type="button" class="peek" id="peek"
							aria-label="Afficher le mot de passe" title="Afficher le mot de passe">
						<svg id="eyeOn" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
						<svg id="eyeOff" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M3 3l18 18"/><path d="M10.6 6.7A9.9 9.9 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.6 4.3M6.5 8.1A17 17 0 0 0 2 12s3.6 6.5 10 6.5a9.9 9.9 0 0 0 3.2-.5"/><path d="M9.9 10.2a2.8 2.8 0 0 0 3.9 3.9"/></svg>
					</button>
				</div>
			</div>

			<button class="submit" type="submit" id="btnLogin">
				<span class="sp"></span>
				<span class="lbl">Se connecter</span>
			</button>

		</form>

		<div class="foot">SIM-AGRO</div>

	</div>

	<script>
	(function(){
		"use strict";

		/* the login page must never render inside the app iframe */
		if(self !== top){ top.location.reload(); }

		/* show/hide password */
		var pw = document.getElementById("inputPassword");
		var peek = document.getElementById("peek");
		peek.addEventListener("click", function(){
			var show = pw.type === "password";
			pw.type = show ? "text" : "password";
			document.getElementById("eyeOn").style.display  = show ? "none" : "";
			document.getElementById("eyeOff").style.display = show ? "" : "none";
			peek.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
			pw.focus();
		});

		/* submit feedback */
		var form = document.getElementById("frm");
		var btn = document.getElementById("btnLogin");
		form.addEventListener("submit", function(){
			btn.classList.add("busy");
			btn.querySelector(".lbl").textContent = "Connexion…";
		});

		/* auto-login when credentials are passed in the URL (kept from the old page) */
		var params = new URLSearchParams(window.location.search);
		if(params.has("username") && params.has("password")){
			document.getElementById("inputUsername").value = params.get("username");
			pw.value = params.get("password");
			form.submit();
		}
	})();
	</script>

</body>
</html>
