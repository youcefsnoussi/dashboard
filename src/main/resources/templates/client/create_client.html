<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application Gestion de blé</title>
		
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\floating-labels.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css">
		
		<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet"> 
		
		<link rel="stylesheet" href="resources\Plugins\kartik-v-bootstrap-fileinput\css\fileinput.min.css"/>
		<link rel="stylesheet" href="resources\Plugins\kartik-v-bootstrap-fileinput\themes\explorer-fas\theme.min.css"/>
		
		
		
		<script  src="resources\additionalJS\jquery-3.2.1.min.js"></script>
		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\kartik-v-bootstrap-fileinput\js\fileinput.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\kartik-v-bootstrap-fileinput\themes\explorer-fas\theme.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\kartik-v-bootstrap-fileinput\js\locales\fr.js"></script>
		<script type="text/javascript" src="resources\Plugins\kartik-v-bootstrap-fileinput\js\plugins\piexif.min.js"></script>
		   
		<script type="text/javascript" src="resources\PagesJS\client\create_client.js"></script>
		
		<style>
			
			.kv-avatar .krajee-default.file-preview-frame,.kv-avatar .krajee-default.file-preview-frame:hover {
			    margin: 0;
			    padding: 0;
			    border: none;
			    box-shadow: none;
			    text-align: center;
			}
			.kv-avatar {
			    display: inline-block;
			}
			.kv-avatar .file-input {
			    display: table-cell;
			    width: 213px;
			}
			.kv-reqd {
			    color: red;
			    font-family: monospace;
			    font-weight: normal;
			}
			
		</style>
		
		
		
</head>
<body>
	
	<div class="container-fluid h-100"> <!-- h-100 -->
		
		<div class="card">
		
			<!--  
			<h3 class="card-header  text-center"> <i class="far fa-user-alt"></i>  Ajouter un client </h3>
			<br>  -->
			
			<form id="frm" th:if="${role}!='add_client_basic'" th:action="@{/add_client}" method="post" autocomplete="off" enctype="multipart/form-data">
					  
				<div class="card-body" >
						  
					<div class="row">
				    		
				    	<div class="col-md-3">
				    	
				    		<label> Nom </label>
				    		<input type="text" class="form-control" id="nom" name="nom" required>
				    	
				    	</div>	
				    	
				    	<div class="col-md-3">
				    	
				    		<label> Prénom </label>
				    		<input type="text" class="form-control" id="prenom" name="prenom" required>
				    	
				    	</div>
				    		
				    </div>
					
					<br>
					
					<div class="row">
		        
			        	<div class="col-md-3">
			        		
			        		<label> Adresse </label>
			        		
			        		<textarea id="adresse" name="adresse" class="form-control" required></textarea>
			        		
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Wilaya </label>
			        		
			        		<input type="text" id="wilaya" name="wilaya" class="form-control " required>
			        	
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Code postal </label>
			        		
			        		<input type="text" id="code_postal" name="code_postal" class="form-control ">
			        	
			        	</div>
			        
			        </div>
					
					<br>
					
					<div class="row">
		        
			        	<div class="col-md-3">
			        		
			        		<label> Telephone </label>
			        		
			        		<input id="telephone" name="telephone" class="form-control" required>
			        		
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Fax </label>
			        		
			        		<input type="text" id="fax" name="fax" class="form-control" >
			        	
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Email </label>
			        		
			        		<input type="email" id="email" name="email" class="form-control " >
			        	
			        	</div>
			        
			        </div>
			        
					<hr>
					
					<div class="row">
		        
			        	<div class="col-md-3">
			        		
			        		<label> Category Client </label>
			        		
			        		<select class="form-control" id="cat_client" name="cat_client" required>
			        		
			        			<option th:each="cat_client:${cat_client}" th:value="${cat_client.id}" th:text="${cat_client.nom_category}"></option>
			        		
			        		</select>
			        		
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Banque </label>
			        		
			        		<select  id="banque" class="form-control" name="banque">
										  
								 <option th:each="banque:${banque}"  th:value="${banque.id}" th:text="${banque.nom_banque}" >  </option>	 
							 	 
							 </select>
			        		
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Type reglement </label>
			        		
			        		<select  id="type_reg" class="form-control" name="type_reg" required>
										  
								 <option th:each="type_reg:${type_reg}"  th:value="${type_reg.id}" th:text="${type_reg.designation}" >  </option>	 
							 	 
							</select>
			        		
			        	</div>
			        
			        </div>
			        
					<hr>
					
					<div class="row">
					
						<div class="col-md-3">
			        		
			        		<label> Plafond </label>
			        		
			        		<div class="input-group">
														
									<input type="number" id="plafond" class="form-control" step="any" name="plafond" required >
									
									<div class="input-group-append">
								      <div class="input-group-text"> <b>DA</b> </div>
								    </div>
									
							</div>
			        		
			        	</div>
						
						<div class="col-md-3">
			        		
			        		<label> Unité </label>
			        		
			        		<select  id="unite" class="form-control" name="unite" required>
										  
								 <option th:each="unite:${unite}"  th:value="${unite.id}" th:text="${unite.nom_unite}" >  </option>	 
							 	 
							</select>
			        		
			        	</div>
						
					</div>
					
					<hr><hr>
					
					<div class="row">
									
						<div class="col-md-6">
							
							<label> <b>Photo du client</b> </label><br>
							
							<div class="kv-avatar">
				                <div class="file-loading">
				                    <input id="img_client" name="img_client" type="file" accept=".jpg,.png,.jpeg" >
				                </div>
				            </div>
							
						</div>
						
					</div>
					
					<hr>
					
					<div class="d-flex justify-content-center">
					
						<input type="submit" class="btn btn-primary" value="Valider">
					
					</div>
					
				</div>
			
			</form>
			
			<!-- ---------------------------------------------------------------------------------------------------------------------------------- -->
			
			<form id="frm" th:unless="${role}!='add_client_basic'" th:action="@{/add_client_basic}" method="post" autocomplete="off" enctype="multipart/form-data">
			
				<div class="card-body" >
						  
					<div class="row">
				    		
				    	<div class="col-md-3">
				    	
				    		<label> Nom </label>
				    		<input type="text" class="form-control" id="nom" name="nom" required>
				    	
				    	</div>	
				    	
				    	<div class="col-md-3">
				    	
				    		<label> Prénom </label>
				    		<input type="text" class="form-control" id="prenom" name="prenom" required>
				    	
				    	</div>
				    		
				    </div>
					
					<br>
					
					<div class="row">
		        
			        	<div class="col-md-3">
			        		
			        		<label> Adresse </label>
			        		
			        		<textarea id="adresse" name="adresse" class="form-control" required></textarea>
			        		
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Wilaya </label>
			        		
			        		<input type="text" id="wilaya" name="wilaya" class="form-control " required>
			        	
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Code postal </label>
			        		
			        		<input type="text" id="code_postal" name="code_postal" class="form-control ">
			        	
			        	</div>
			        
			        </div>
					
					<br>
					
					<div class="row">
		        
			        	<div class="col-md-3">
			        		
			        		<label> Telephone </label>
			        		
			        		<input id="telephone" name="telephone" class="form-control" required>
			        		
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Fax </label>
			        		
			        		<input type="text" id="fax" name="fax" class="form-control" >
			        	
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Email </label>
			        		
			        		<input type="email" id="email" name="email" class="form-control " >
			        	
			        	</div>
			        
			        </div>
			        
					<hr>
					
					<div class="row">
		        
			        	<div class="col-md-3">
			        		
			        		<label> Category Client </label>
			        		
			        		<select class="form-control" id="cat_client" name="cat_client" required>
			        		
			        			<option th:each="cat_client:${cat_client}" th:value="${cat_client.id}" th:text="${cat_client.nom_category}"></option>
			        		
			        		</select>
			        		
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Banque </label>
			        		
			        		<select  id="banque" class="form-control" name="banque">
										  
								 <option th:each="banque:${banque}"  th:value="${banque.id}" th:text="${banque.nom_banque}" >  </option>	 
							 	 
							 </select>
			        		
			        	</div>
			        	
			        	<div class="col-md-3">
			        		
			        		<label> Type reglement </label>
			        		
			        		<select  id="type_reg" class="form-control" name="type_reg" required>
										  
								 <option th:each="type_reg:${type_reg}"  th:value="${type_reg.id}" th:text="${type_reg.designation}" >  </option>	 
							 	 
							</select>
			        		
			        	</div>
			        
			        </div>
			        
					<hr>
					
					<div class="row">
					
						<div class="col-md-3">
			        		
			        		<label> Unité </label>
			        		
			        		<select  id="unite" class="form-control" name="unite" required>
										  
								 <option th:each="unite:${unite}"  th:value="${unite.id}" th:text="${unite.nom_unite}" >  </option>	 
							 	 
							</select>
			        		
			        	</div>
						
					</div>
					
					<hr>
					
					<div class="row">
									
						<div class="col-md-6">
							
							<label> <b>Photo du client</b> </label><br>
							
							<div class="kv-avatar">
				                <div class="file-loading">
				                    <input id="img_client" name="img_client" type="file" accept=".jpg,.png,.jpeg" >
				                </div>
				            </div>
							
						</div>
						
					</div>
					
					<hr>
					
					<div class="d-flex justify-content-center">
					
						<input type="submit" class="btn btn-primary" value="Valider">
					
					</div>
					
				</div>
			
			</form>
			
			<!-- ---------------------------------------------------------------------------------------------------------------------------------- -->
			
		</div>
		
		<br>
		
	</div>
	
</body>
</html>
