<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application Gestion de blé</title>
		
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\floating-labels.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css">
		<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet"> 
		
		<script  src="resources\additionalJS\jquery-3.2.1.min.js"></script>
		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\kartik-v-bootstrap-fileinput\js\fileinput.min.js"></script>
		
		<script type="text/javascript" src="resources\PagesJS\client\rc_client.js"></script>
		
		
</head>
<body>
	
	<div class="container-fluid h-100">
		
		<div class="card">
		
			<!--  
			<h3 class="card-header  text-center"> <i class="far fa-file-invoice"></i>  Nouveau registre commerce </h3>
			<br>
			-->
				<form id="frm" th:action="@{/relation_rc_clt}" method="post" autocomplete="off">
				
							  
					<div class="card-body" >
						
						<div class="row">
							
							<div class="col-md-3 offset-md-1">
								
								<label> Client </label>
								
								<select id="id_client" class="selectpicker" data-live-search="true" data-container="body" 
									name="id_client" required>
								
									<option th:each="c:${client}" th:value="${c.id}" th:text="${c.nom}+' '+${c.prenom}" > </option>
								
								</select>
							
							</div>
							
							<div class="col-md-3">
							
								<i class="far fa-repeat" style="margin-left:50%;font-size: 39px;"></i>
							
							</div>
							
							<div class="col-md-3">
								
								<label> RC </label>
								
								<select id="id_rc" class="selectpicker" data-live-search="true" data-container="body" 
									name="id_rc" required>
								
									<option th:each="rc:${rc}" th:value="${rc.id}" th:text="${rc.nom}+' '+${rc.prenom}" 
										th:attr="data-subtext=${rc.code}"> </option>
								
								</select>
							
							</div>
							
						</div>
			        	<br>
			        	<div class="row">
			        
				        	<div class="col-md-3 offset-md-1">
				        		
				        		<label> Date Debut </label>
				        		
				        		<input type="date" id="date_debut" name="date_debut" class="form-control" required>
				        	
				        	</div>
				        	 
				        	<div class="col-md-3 offset-md-3">
				        		
				        		<label> Date Fin </label>
				        		
				        		<input type="date" id="date_fin" name="date_fin" class="form-control" required>
				        	
				        	</div>
				        	
			        	</div>
			        	
						<hr>
						
						<div class="d-flex justify-content-center">
						
							<input type="submit" class="btn btn-primary" value="Valider">
						
						</div>
						
					</div>
				
				</form>
				
			</div>
			
		</div>
		
		<br>
		
		<!-- ------------------------------------------------------------result message ------------------------------------------------------------- -->
		
		<div id="error" class="modal" tabindex="-1" role="dialog">
		  <div class="modal-dialog" role="document">
		    <div class="modal-content">
		      <div class="modal-header">
		        <i id="icone" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title"></h5>
		        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
		          <span aria-hidden="true">&times;</span>
		        </button>
		      </div>
		      <div class="modal-body">
		        <p id="text"></p>
		      </div>
		      <div class="modal-footer">
		        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
		      </div>
		    </div>
		  </div>
		</div>
	
</body>
</html>
