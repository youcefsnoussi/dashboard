<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application Commercial</title>
		
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\floating-labels.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css">
		
		<link rel="stylesheet" href="resources\Plugins\datatable\css\dataTables.bootstrap4.min.css" />  
		
		<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet"> 
		
		<script  src="resources\additionalJS\jquery-3.2.1.min.js"></script>
		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\sum().js"></script>
		
		<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript" src="resources\PagesJS\client\list_client.js"></script>
		
		
</head>
<body>
	
	<div class="container-fluid h-100">
		
		<div class="card">
		
			
			<h3 class="card-header  text-center"> <i class="far fa-address-book"></i>  List des Clients </h3>
			<br>
			
			<div class="card-body">
			
				<div class="container-fluid">
					
					<div class="row">
					
						<div class="col-md-3" >
						
							<button id="add_client" class="btn btn-dark btn_icon"> <span> Ajouter un nouveau Client </span> <i class="far fa-plus-circle"></i> </button>
						
						</div>
					
					</div>
					
					<hr>
					
					<table id="table" class="table table-bordered table-hover" style="width:100%">
					
						<thead class="thead-dark">
						
							<tr>
							
								<th>Code Client</th>
								<th>Nom Prénom</th>
								<th>Category</th>
								<th>Sold encours</th>
								<th>Plafond</th>
								<th>Etat blockage</th>
								<th>Détail</th>
								
							</tr>
						
						</thead>
						
						<tbody>
						
							<tr th:each="client:${clients_info}">
							
								<td th:text="${client.code}"></td>
								<td th:text="${client.nom}+' '+${client.prenom}"></td>
								<td th:text="${client.category.nom_category}"></td>
								<td th:text="${#numbers.formatDecimal(client.sold_encours, 3, 'WHITESPACE', 2,'POINT')}"></td>
								<td th:text="${#numbers.formatDecimal(client.plafond, 3, 'WHITESPACE', 2,'POINT')}"></td>
								<td th:if="${client.etat_blockage}==false" style="text-align:center"> <button type="button" class="btn active btn-lg btn-success rounded-pill"  data-toggle="tooltip" data-placement="bottom" title="Active"></button> </td>
								<td th:unless="${client.etat_blockage}==false" style="text-align:center"> <button type="button" class="btn active btn-lg btn-danger rounded-pill" data-toggle="tooltip" data-placement="bottom" title="Blocké"></button> </td>
								<td style="text-align: center;"> <button type="button" class="btn btn-info edit" th:attr="id_client=${client.id}"> 
																				<i class="far fa-info-square"></i>
																		 </button> 
								</td>
								
							</tr>
						
						</tbody>
						
						<tfoot class="thead-dark">
						
							<tr>
							
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								
							</tr>
						
						</tfoot>
						
					</table>
				
				</div>
			
			</div>
			
		</div>
		
	</div>
	
	<div id="new_client" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i class="far fa-user-alt" style="font-size:30px;margin-right:10px;" id="icone"></i> <h5 class="modal-title" id="title"> Nouveau Client </h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      
	      <div id="print_content" class="modal-body embed-responsive embed-responsive-16by9 overflow-hidden" >
	         
	         
	         
	      </div>
	      
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	      
	    </div>
	  </div>
	</div>
	
	<!-- ---------------------------------------------------------- ------ ----------------------------------------------------------------------------------- -->
	
	
	
</body>
</html>
