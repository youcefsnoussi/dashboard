<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application Commercial</title>
		
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\floating-labels.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css">
		
		<link rel="stylesheet" href="resources\Plugins\datatable\css\dataTables.bootstrap4.min.css" />  
		
		<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet"> 
		
		<script  src="resources\additionalJS\jquery-3.2.1.min.js"></script>
		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\sum().js"></script>
		
		<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript" src="resources\PagesJS\client\list_rc.js"></script>
		
		
</head>
<body>
	
	<div class="container-fluid h-100">
		
		<div class="card">
		
			
			<h3 class="card-header  text-center"> <i class="far fa-list-alt"></i>  List des Registres commerces </h3>
			<br>
			
			<div class="card-body">
			
				<div class="container-fluid">
					
					<div class="row">
					
						<div class="col-md-3" >
						
							<button id="add_rc" class="btn btn-dark btn_icon"> <span> Ajouter un nouveau RC </span> <i class="far fa-plus-circle"></i> </button>
						
						</div>
						
						<div class="col-md-3" >
						
							<button id="rc_clt" class="btn btn-dark btn_icon"> <span> Client </span> <i class="far fa-repeat"></i> <span> RC </span> </button>
						
						</div>
						
					</div>
					
					<hr>
					
					<ul class="nav nav-tabs" id="myTab" role="tablist">
					
					  <li class="nav-item">
					    <a class="nav-link active" data-toggle="tab" href="#rc_list" role="tab" aria-controls="info" aria-selected="true">List des RC</a>
					  </li>
					  
					  <li class="nav-item">
					    <a class="nav-link" data-toggle="tab" href="#rc_c_list" role="tab" aria-controls="info" aria-selected="true">Liste des RC + clients</a>
					  </li>
					  
					</ul>
					
					<div class="tab-content" id="myTabContent">
						
						<div class="tab-pane fade show active" id="rc_list" role="tabpanel" >
							
							<br>
							
							<table id="table" class="table table-bordered table-hover" style="width:100%">
							
								<thead class="thead-dark">
								
									<tr>
										
										<th>Code</th>
										<th>N° RC</th>
										<th>Nom Prénom</th>
										<th>Sold enours</th>
										<th>Plafond</th>
										<th>Etat blockage</th>
										<th>Détail</th>
										
									</tr>
								
								</thead>
								
								<tbody>
								
									<tr th:each="rc:${rc_info}">
										
										<td th:text="${rc.code}"></td>
										<td th:text="${rc.numero_rc}"></td>
										<td th:text="${rc.nom}+' '+${rc.prenom}"></td>
										<td th:text="${#numbers.formatDecimal(rc.sold_encours, 3, 'WHITESPACE', 0,'COMMA')}"></td>
										<td th:text="${#numbers.formatDecimal(rc.plafond, 3, 'WHITESPACE', 0,'COMMA')}"></td>
										<td th:if="${rc.etat_blockage}=='active'" style="text-align:center"> <button type="button" class="btn active btn-lg btn-success rounded-pill"  data-toggle="tooltip" data-placement="bottom" title="Active"></button> </td>
										<td th:if="${rc.etat_blockage}=='block'" style="text-align:center"> <button type="button" class="btn active btn-lg btn-danger rounded-pill" data-toggle="tooltip" data-placement="bottom" title="Blocké"></button> </td>
										<td th:if="${rc.etat_blockage}=='blacklist'" style="text-align:center"> <button type="button" class="btn active btn-lg btn-dark rounded-pill" data-toggle="tooltip" data-placement="bottom" title="Blackliste"></button> </td>
										<td style="text-align: center;"> <button type="button" class="btn btn-info edit" th:attr="id_rc=${rc.id}"> 
																						<i class="far fa-info-square"></i>
																				 </button> 
										</td>
										
									</tr>
								
								</tbody>
								
								<tfoot>
								
									<tr>
										
										<th></th>
										<th></th>
										<th></th>
										<th></th>
										<th></th>
										<th></th>
										<th></th>
										
									</tr>
								
								</tfoot>
								
							</table>
						
						</div>
						
						<div class="tab-pane fade embed-responsive embed-responsive-16by9" id="rc_c_list" role="tabpanel" >
					  	
					  		<iframe width="" height="" id="client_list" frameborder="0" src='list_rc_clt?id_client=0&id_rc=0'></iframe>
					  	
					  	</div>
						
					</div>
				
				</div>
			
			</div>
			
		</div>
		
	</div>
	
	<div id="new_rc" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i class="far fa-user-alt" style="font-size:30px;margin-right:10px;" id="icone"></i> <h5 class="modal-title" id="title"> Nouveau Client </h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      
	      <div class="modal-body embed-responsive embed-responsive-16by9" id="print_content">
	        
	         <!--  <iframe id="frame" width="100%" height="100%" onload="ifrhgh()" frameborder="0" src="/add_client"></iframe>  -->
	        
	      </div>
	      
	      <div class="modal-footer">
	        <button type="button" id="closee" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	<!-- ---------------------------------------------------------- ------ ----------------------------------------------------------------------------------- -->
	
	
	
</body>
</html>
