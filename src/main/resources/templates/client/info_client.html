<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application Gestion de blé</title>
		
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\floating-labels.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css">
		
		<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet"> 
		
		<link rel="stylesheet" href="resources\Plugins\kartik-v-bootstrap-fileinput\css\fileinput.min.css"/>
		
		
		
		<script  src="resources\additionalJS\jquery-3.2.1.min.js"></script>
		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\kartik-v-bootstrap-fileinput\js\fileinput.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\kartik-v-bootstrap-fileinput\js\locales\fr.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\kartik-v-bootstrap-fileinput\js\plugins\purify.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\kartik-v-bootstrap-fileinput\js\plugins\sortable.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\kartik-v-bootstrap-fileinput\js\plugins\piexif.min.js"></script>   
		
		<script type="text/javascript" src="resources\PagesJS\client\info_client.js"></script>
		
		<style>
			
			.kv-avatar .krajee-default.file-preview-frame,.kv-avatar .krajee-default.file-preview-frame:hover {
			    margin: 0;
			    padding: 0;
			    border: none;
			    box-shadow: none;
			    text-align: center;
			}
			.kv-avatar {
			    display: inline-block;
			}
			.kv-avatar .file-input {
			    display: table-cell;
			    width: 213px;
			}
			.kv-reqd {
			    color: red;
			    font-family: monospace;
			    font-weight: normal;
			}
			
		</style>
		
</head>
<body>
	
	<div class="container-fluid h-100"> 	<!-- h-100 -->
		
		<div class="card">
		
			<!--  
			<h3 class="card-header  text-center"> <i class="far fa-user-alt"></i>  Ajouter un client </h3>
			<br>  -->
					  
				<div class="card-body" >
						  
					<ul class="nav nav-tabs" id="myTab" role="tablist">
					
					  <li class="nav-item">
					    <a class="nav-link active" data-toggle="tab" href="#info" role="tab" aria-controls="info" aria-selected="true">Info</a>
					  </li>
					  
					  <li class="nav-item">
					    <a class="nav-link" data-toggle="tab" href="#list_rc" role="tab" aria-controls="info" aria-selected="true">Registre Commerce</a>
					  </li>
					  
					  <li class="nav-item">
					    <a class="nav-link" data-toggle="tab" href="#list_facture" role="tab" aria-controls="info" aria-selected="true">Factures</a>
					  </li>
					  
					  <li class="nav-item">
					    <a class="nav-link" data-toggle="tab" href="#list_facture_a" role="tab" aria-controls="info" aria-selected="true">Factures d'avoir</a>
					  </li>
					  
					  <li class="nav-item">
					    <a class="nav-link" data-toggle="tab" href="#payment_list" role="tab" aria-controls="info" aria-selected="true">Paiements</a>
					  </li>
					  
					</ul>
					
					<div class="tab-content" id="myTabContent">
					  <!-- ------------------------------------------------------------------INFO CLIENT ------------------------------------------------------------ -->
					  <div class="tab-pane fade show active" id="info" role="tabpanel" >
					  	
					  		<form id="frm" th:if="${edit_option}=='edit'" th:action="@{/edit_client}" method="post" autocomplete="off"  enctype="multipart/form-data">
					  			
					  			<div class="card-body" th:with="c = ${client}">
						  			
						  			<input type="hidden" id="id_c" name="id_c" th:value="${c.id}">
						  			
									<div class="row">
								    		
								    	<div class="col-md-3">
								    	
								    		<label> Nom </label>
								    		<input type="text" class="form-control" id="nom" name="nom" th:value="${c.nom}" required>
								    	
								    	</div>	
								    	
								    	<div class="col-md-3">
								    	
								    		<label> Prénom </label>
								    		<input type="text" class="form-control" id="prenom" name="prenom" th:value="${c.prenom}" required>
								    	
								    	</div>
								    	
								    	<div class="col-md-3">
								    	
								    		<label> Etat blockage </label> <br>
								    		<button id="no_block" type="button" class="btn btn-lg btn-success rounded-pill" 
								    			data-toggle="tooltip" data-placement="bottom" title="Active" ></button>
								    		<button id="block" type="button" class="btn btn-lg btn-danger rounded-pill" 
								    			data-toggle="tooltip" data-placement="bottom" title="Blocké"></button>
								    		
								    		<input type="hidden" id="etat_blockage" name="etat_blockage" th:value="${c.etat_blockage}">
								    		
								    	</div>
								    		
								    </div>
									
									<br>
									
									<div class="row">
						        
							        	<div class="col-md-3">
							        		
							        		<label> Adresse </label>
							        		
							        		<textarea id="adresse" name="adresse" class="form-control" th:text="${c.adresse}" required></textarea>
							        		
							        	</div>
							        	
							        	<div class="col-md-3">
							        		
							        		<label> Wilaya </label> <br>
							        		
							        		<select class="selectpicker show-tick" data-style="btn btn-outline-secondary" data-live-search="true" 
							        				id="wilaya" name="wilaya" required>
												
												<option th:each="w:${wilaya}" th:if="${w}==${c.wilaya}" th:value="${w.id}" 
													th:text="${w.designation}" selected></option>
												   
												<option th:each="w:${wilaya}" th:unlesse="${w}==${c.wilaya}" th:value="${w.id}" 
													th:text="${w.designation}" ></option>
											
											</select>
							        	
							        	</div>
							        
							        </div>
									
									<br>
							        
									<hr>
									
									<div class="row">
						        
							        	<div class="col-md-3">
							        		
							        		<label> Category Client </label>
							        		
							        		<select class="form-control" id="cat_client" name="cat_client" required >
							        		
							        			<option th:each="cat_client:${cat_client}" th:value="${cat_client.id}" th:text="${cat_client.nom_category}"></option>
							        		
							        		</select>
							        		
							        	</div>
							        
							        </div>
							        
									<hr>
									
									<div class="row">
									
										<div class="col-md-3">
							        		
							        		<label> Plafond </label>
							        		
							        		<div class="input-group">
																		
													<input type="number" id="plafond" class="form-control" step="any" name="plafond" th:value="${c.plafond}" required >
													
													<div class="input-group-append">
												      <div class="input-group-text"> <b>DA</b> </div>
												    </div>
													
											</div>
							        		
							        	</div>
										
									</div>
									
									<hr>
									
									<div class="row">
										
										<input type="hidden" id="category_client" th:value="${c.category.id}" >
										
										<input type="hidden" id="image_client" th:value="${c.img}" >
													
										<div class="col-md-6">
											
											<label> <b>Photo du client</b> </label><br>
											
											<div class="kv-avatar">
								                <div class="file-loading">
								                    <input id="img_client" name="img_client" type="file" accept=".jpg,.png,.jpeg" >
								                </div>
								            </div>
											
										</div>
										
									</div>
									
									<hr>
									
									<div class="d-flex justify-content-center">
									
										<input type="submit" class="btn btn-primary" value="Valider">
									
									</div>
									
								</div>
					  		
					  		</form>
					  		
					  		<!-- ------------------------------------------------------------------------------------------------------------------- -->
					  		
					  		<div class="card-body" th:unless="${edit_option}=='edit'" th:with="c = ${client}">
						  			
						  			<input type="hidden" id="id_c" name="id_c" th:value="${c.id}" disabled>
						  			
									<div class="row">
								    		
								    	<div class="col-md-3">
								    	
								    		<label> Nom </label>
								    		<input type="text" class="form-control" id="nom" name="nom" th:value="${c.nom}" disabled>
								    	
								    	</div>	
								    	
								    	<div class="col-md-3">
								    	
								    		<label> Prénom </label>
								    		<input type="text" class="form-control" id="prenom" name="prenom" th:value="${c.prenom}" disabled>
								    	
								    	</div>
								    	
								    	<div class="col-md-3">
								    	
								    		<label> Etat blockage </label> <br>
								    		<button id="no_block" type="button" class="btn btn-lg btn-success rounded-pill" 
								    			data-toggle="tooltip" data-placement="bottom" title="Active" disabled></button>
								    		<button id="block" type="button" class="btn btn-lg btn-danger rounded-pill" 
								    			data-toggle="tooltip" data-placement="bottom" title="Blocké" disabled></button>
								    		
								    		<input type="hidden" id="etat_blockage" name="etat_blockage" th:value="${c.etat_blockage}">
								    		
								    	</div>
						    			
								    </div>
									
									<br>
									
									<div class="row">
						        
							        	<div class="col-md-3">
							        		
							        		<label> Adresse </label>
							        		
							        		<textarea id="adresse" name="adresse" class="form-control" th:text="${c.adresse}" disabled></textarea>
							        		
							        	</div>
							        	
							        	<div class="col-md-3">
							        		
							        		<label> Wilaya </label>
							        		
							        		<input type="text" id="wilaya" name="wilaya" class="form-control" th:value="${c.wilaya}" disabled>
							        	
							        	</div>
							        
							        </div>
									
									<br>
							        
									<hr>
									
									<div class="row">
						        
							        	<div class="col-md-3">
							        		
							        		<label> Category Client </label>
							        		
							        		<select class="form-control" id="cat_client" name="cat_client" disabled>
							        		
							        			<option th:each="cat_client:${cat_client}" th:value="${cat_client.id}" th:text="${cat_client.nom_category}"></option>
							        		
							        		</select>
							        		
							        	</div>
							        
							        </div>
							        
									<hr>
									
									<div class="row">
									
										<div class="col-md-3">
							        		
							        		<label> Plafond </label>
							        		
							        		<div class="input-group">
																		
													<input type="number" id="plafond" class="form-control" step="any" name="plafond" th:value="${c.plafond}" disabled>
													
													<div class="input-group-append">
												      <div class="input-group-text"> <b>DA</b> </div>
												    </div>
													
											</div>
							        		
							        	</div>
									
									</div>
									
									<hr>
									
									<div class="row">
										
										<input type="hidden" id="category_client" th:value="${c.category.id}" >
										
										
										<input type="hidden" id="image_client" th:value="${c.img}" >
													
										<div class="col-md-6">
											
											<label> <b>Photo du client</b> </label><br>
											
											<div class="kv-avatar">
								                <div class="file-loading">
								                    <input id="img_client" name="img_client" type="file" accept=".jpg,.png,.jpeg" disabled>
								                </div>
								            </div>
											
										</div>
										
									</div>
									
									
								</div>
					  		
					  		
					  </div>
					  
					   <!-- ------------------------------------------------------------------ END INFO-CLIENT ------------------------------------------------------------ -->
					  
					  <div class="tab-pane fade" id="list_rc" role="tabpanel" >
					  	
					  	<iframe th:with="c = ${client}" width="100%" height="900" id="rc_list" frameborder="0" th:attr="src='list_rc_clt?id_rc=0&id_client='+${c.id}"></iframe>
					  	
					  </div>
					  
					  <div class="tab-pane fade" id="list_facture" role="tabpanel" >
					  
					  	<iframe th:with="c = ${client}" width="100%" height="900" id="facture_list" frameborder="0" th:attr="src='list_fact_client?date_debut=0&date_fin=0&id_client='+${c.id}"></iframe>
					  
					  </div>
					  
					  <div class="tab-pane fade" id="list_facture_a" role="tabpanel" >
					  
					  	<iframe th:with="c = ${client}"width="100%" height="900" id="facture_a_list" frameborder="0" th:attr="src='list_fact_avoir_client?id_client='+${c.id}"></iframe>
					  
					  </div>
					  <div class="tab-pane fade" id="payment_list" role="tabpanel" >
					  
					  	<iframe th:with="c = ${client}" width="100%" height="900" id="payment_list" frameborder="0" th:attr="src='list_payment_cl?id_client='+${c.id}"></iframe>
					  
					  </div>
					  
					</div>
					
				</div>
			
		</div>
		
		<br>
		
	</div>
	
</body>
</html>
