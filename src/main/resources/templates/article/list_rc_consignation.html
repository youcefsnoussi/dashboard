<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application Commercial</title>
		
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\floating-labels.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css">
		
		<link rel="stylesheet" href="resources\Plugins\datatable\css\dataTables.bootstrap4.min.css" />  
		
		<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet"> 
		
		<script  src="resources\additionalJS\jquery-3.2.1.min.js"></script>
		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\sum().js"></script>
		
		<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript" >
		
		$(document).ready(function() {
			
			var h = window.innerHeight;
			
			var datatable_config = {
					"language": {
				            "url": "resources/Plugins/datatable/lang/French.json"
				    },
					"ordering": true,
			    	"bPaginate": false,
					"scrollY":h-450,
					"scrollX": "auto",
			        "deferRender": true,
			        initComplete: function () {
			            this.api().columns([0,1,2,3]).every( function () {
			                var column = this;
			                var select = $('<select class="form-control" ><option value="">Tout</option></select>')
			                    .appendTo( $(column.footer()).empty() )
			                    .on( 'change', function () {
			                        var val = $.fn.dataTable.util.escapeRegex(
			                            $(this).val()
			                        );
			 
			                        column
			                            .search( val ? '^'+val+'$' : '', true, false )
			                            .draw();
			                    } );
			 
			                column.data().unique().sort().each( function ( d, j ) {
			                    select.append( '<option value="'+d+'">'+d+'</option>' )
			                } );
			            } );
			        },
					drawCallback: function () {
						  /*
					      var api = this.api();
					      
					      $( api.column( 2, {page:'current'} ).footer() ).html(
					        api.column( 2, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					      $( api.column( 3, {page:'current'} ).footer() ).html(
					        api.column( 3, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      */
					 },
		    };
		 		
		 	var table = $('#table').DataTable(datatable_config);
			
			$("#add_rel").click(function(){
				
				$('#print_content').html('<iframe id="frame" width="" height="" frameborder="0" '+
						'src="rc_cons_rel"></iframe>');
				
				$("#title").text("Relier Article et consignation");
				
				$("#icone").attr("class","far fa-repeat");
				             
				$("#new_art").modal("show");
				
			});
			
			$(".edit").click(function(){
				
				let id_rel_art_cons = $(this).attr("id_rel");
				
				let input = $(this).parent().find(".prix");
				
				if(parseFloat(input.val()) > 0){
				
					$.ajax({
			 			url : 'update_division_rc_cons',
			 			data : {
			 				id_relation : id_rel_art_cons,
			 				price : parseFloat(input.val())
			 			},
			 			success : function(responseJson) {
			 				
			 				$("#title_error").text("Opération Effectuer");
							
							$("#icone_error").attr("class","far fa-info-square");
							
							$("#text").text("Modification éffectuer");
							
							$("#error").modal("show");
			 				
			 			}
			 		});
				
				}
				else{
					
					$("#title_error").text("Erreur !!!");
					
					$("#icone_error").attr("class","far fa-exclamation-triangle");
					
					$("#text").text("Prix doit être supperieur a 0");
					
					$("#error").modal("show");
					
				}
				
			});
			
			/////////////////------------- END ----------------- 
		});
		
		</script>
		
		
		<link rel="stylesheet" href="resources\additionalCSS\app-theme.css?v=20260902c">
		<script src="resources\additionalJS\app-theme.js?v=20260902c"></script>
	</head>
<body>
	
	<div class="container-fluid h-100">
		
		<div class="card">
		
			
			<h3 class="card-header  text-center"> <i class="far fa-list-alt"></i>  List des RC avec consignations </h3>
			<br>
			
			<div class="card-body">
			
				<div class="container-fluid">
					
					<div class="row">
					
						<div class="col-md-3">
						
							<button id="add_rel" class="btn btn-dark btn_icon"> <span> Relier Rc consignation </span> <i class="far fa-plus-circle"></i> </button>
						
						</div>
						
					</div>
					
					<hr>
					
					<table id="table" class="table table-bordered table-hover" style="width:100%">
					
						<thead class="thead-dark">
						
							<tr>
							
								<th>Code</th>
								<th>Registre commerce</th>
								<th>Code Art consignation</th>
								<th>Libelle consignation</th>
								<th>Sold Physique</th>
								<th>Sold Valorisé</th>
								<th>Prix</th>
								
							</tr>
						
						</thead>
						
						<tbody>
						
							<tr th:each="rc_cons:${rcs_cons}">
							
								<td th:text="${rc_cons.registre_commerce.code}"></td>
								<td th:text="${rc_cons.registre_commerce.nom}+' '+${rc_cons.registre_commerce.prenom}"></td>
								<td th:text="${rc_cons.article_consignation.code}"></td>
								<td th:text="${rc_cons.article_consignation.libelle}"></td>
								<td th:text="${#numbers.formatDecimal(rc_cons.sold_physique, 1, 'WHITESPACE', 2, 'COMMA')}"></td>
								<td th:text="${#numbers.formatDecimal(rc_cons.sold_valorise, 1, 'WHITESPACE', 2, 'COMMA')}"></td>
								<td style="text-align: center;">
									<div class="input-group">
										<input type="number" step="any" class="form-control prix" th:value="${rc_cons.prix_u_ht}" 
											style="width:50%;"> 
										<button type="button" class="btn btn-success edit" th:attr="id_rel=${rc_cons.id}"> 
											<i class="far fa-edit"></i>
										</button> 
									</div>
								</td>
								
							</tr>
						
						</tbody>
						
						<tfoot class="thead-dark">
						
							<tr>
							
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								
							</tr>
						
						</tfoot>
						
					</table>
				
				</div>
			
			</div>
			
		</div>
		
	</div>
	
	<!-- ----------------------------------------------------------------------------------------------------------------------- -->
	
	<div id="new_art" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i class="far fa-user-alt" style="font-size:30px;margin-right:10px;" id="icone"></i> <h5 class="modal-title" id="title"> Nouveau Client </h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      
	      <div class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;" id="print_content">
	        
	         <!--  <iframe id="frame" width="100%" height="100%" onload="ifrhgh()" frameborder="0" src="/add_client"></iframe>  -->
	        
	      </div>
	      
	      <div class="modal-footer">
	        <button type="button" id="closee" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	<!-- ---------------------------------------------------------- ------ ----------------------------------------------------------------------------------- -->
	
	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone_error" class="" style="font-size:30px;margin-right:10px;"></i> <h5 class="modal-title" id="title_error"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <h5 id="text"></h5>
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	
</body>
</html>
