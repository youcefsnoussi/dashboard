			var datatable_config = {
					"language": {
				            "url": "resources/Plugins/datatable/lang/French.json"
				    },
					"ordering": false,
			    	"bPaginate": false,
					"scrollY":"400px",
					"scrollX": "auto",
			        "deferRender": true,
			        initComplete: function () {
			            this.api().columns([3]).every( function () {
			                var column = this;
			                var select = $('<select class="form-control" ><option value="">Tout</option></select>')
			                    .appendTo( $(column.footer()).empty() )
			                    .on( 'change', function () {
			                        var val = $.fn.dataTable.util.escapeRegex(
			                            $(this).val()
			                        );
			 
			                        column
			                            .search( val ? '^'+val+'$' : '', true, false )
			                            .draw();
			                    } );
			 
			                column.data().unique().sort().each( function ( d, j ) {
			                    select.append( '<option value="'+d+'">'+d+'</option>' )
			                } );
			            } );
			        },
					 drawCallback: function () {
						
					      var api = this.api();
					      
					      $( api.column( 4, {page:'current'} ).footer() ).html(
					        api.column( 4, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					 },
		    };
		 		
		 	var table = $('#table').DataTable(datatable_config);
		 	
		 	$("#afficher").click(function(){
		 		
		 		var select_rc = $("#rc").val();
		 		
		 		var start = $("#debut").val();
		 		
		 		var end = $("#fin").val();
		 		
		 		if(select_rc=="0"){
		 			
		 			$("#title_error").text("Erreur !!!");
					$("#icone_error").attr("class","far fa-exclamation-triangle");
					$("#text").text("Veuillez selectionner un RC ");
					$("#error").modal('show');
		 			
		 		}
		 		else{
		 			
		 			if(start=="" && end==""){
		 				
		 				window.location.replace("historic_rc?rc="+select_rc+"&start=0&end=0");
		 				
		 			}
		 			if(start!="" && end!=""){
		 				
		 				window.location.replace("historic_rc?rc="+select_rc+"&start="+start+"&end="+end);
		 				
		 			}
					if(start=="" && end!=""){
		 				
						$("#title").text("Erreur !!!");
						$("#icone").attr("class","far fa-exclamation-triangle");
						$("#text").text("Veuillez selectionner un Intervalle ");
						$("#error").modal('show');
		 				
		 			}
					if(start!="" && end==""){
		 				
						$("#title").text("Erreur !!!");
						$("#icone").attr("class","far fa-exclamation-triangle");
						$("#text").text("Veuillez selectionner un Intervalle ");
						$("#error").modal('show');
		 				
		 			}
		 			
		 		}
		 		
		 	});
		 	
			$(".info").click(function(){
				
				var id_op = $(this).attr("id_operation");
				
				var type_op = $(this).attr("type_operation");
				
				switch(type_op) {
				  case "Facture":
					  	$('#print_content').html('<iframe id="frame" width="100%" height="900" frameborder="0" src="info_fact?id_fact='+id_op+'"></iframe>');
						
						$("#title").text("Détail Facture");
						
						$("#icone").attr("class","far fa-file-invoice");
				  break;
				  case "Facture Avoire":
					  	$('#print_content').html('<iframe id="frame" width="100%" height="900" onload="ifrhgh()" frameborder="0" src="fact_avoir?id_fact='+id_op+'"></iframe>');
						
						$("#title").text("Détail Facture avoire");
						
						$("#icone").attr("class","far fa-file-invoice");
				  break;
				  case "Paiement":
					  	$('#print_content').html('<iframe id="frame" width="100%" height="900" onload="ifrhgh()" frameborder="0" src=""></iframe>');
						
						$("#title").text("Détail paiement");
						
						$("#icone").attr("class","far fa-cash-register");
				  break;
				  case "Annulation Paiement":
					  	$('#print_content').html('<iframe id="frame" width="100%" height="900" onload="ifrhgh()" frameborder="0" src=""></iframe>');
						
						$("#title").text("Détail paiement annuler");
						
						$("#icone").attr("class","far fa-ban");
				  break;		
				  case "Remboursement":
					  	$('#print_content').html('<iframe id="frame" width="100%" height="900" onload="ifrhgh()" frameborder="0" src=""></iframe>');
						
						$("#title").text("Détail Remboursement");
						
						$("#icone").attr("class","far fa-money-check-edit");
				  break;
				}
				
				$("#display_details").modal("show");
				
			});
			
			$("#print").click(function(){
				
				var id_rc = $("#rc").val();
				
				var start = $("#debut").val();
				
				var end = $("#fin").val();
				
				$('#print_content').html('<iframe id="frame" width="100%" height="828" frameborder="0" '+
											'src="print_releve_client?id_rc='+id_rc+'&start='+start+'&end='+end+'"></iframe>');
				
				$("#title").text("Imprimer");
				
				$("#icone").attr("class","far fa-print");
				
				$("#display_details").modal("show");
				
			});
			
			$("#generate").click(function(){
				
				$(".nbr").each(function(){
					
					var s = $(this).text();
					
					$(this).text(s.replace(/ /g, ""));
					
				});
				
				var myExcel = new ExcelGen({
					
					  "src_id": "table",
					
					  "show_header": true
					
				});
				
				myExcel.generate();

																								name="rc" id="rc" data-size="5">

								<option  value="0" th:unless="${id_rc}==0" >RC</option>
								
								<option th:each="rc:${rc}" th:value="${rc.id}" th:text="${rc.code}"
											th:object="${rc}" th:if="${rc.id}==${id_rc}"
											th:attr="data-subtext=${rc.nom}+' '+${rc.prenom}" selected></option>
								
								<option th:each="rc:${rc}" th:value="${rc.id}" th:text="${rc.code}"
											th:object="${rc}" th:unless="${rc.id}==${id_rc}"
											th:attr="data-subtext=${rc.nom}+' '+${rc.prenom}" ></option>
								
							</select>
							
						</div>

								th:value="${start}" placeholder="DU">
								<span class="input-group-text declaration far fa-calendar-alt"> </span>
								<input id="fin" type="date" name="end"  class="form-control date" style="" 
								th:value="${end}" placeholder="AU">
								<button id="afficher" name="afficher" class="btn btn-secondary" type="button">Afficher</button>
									
							</div>
						
						</div>
						
						<div class="col-md-1" >
						
							<button class="btn btn-primary" id="generate">Excel</button>
						
						</div>
						
					</div>

							<tr>

								<th></th>

								<th> <input type="text" id="sold_fin_rc" class="form-control" 
								th:value="${#numbers.formatDecimal(sold_fin_rc, 3, 'WHITESPACE', 2,'POINT')}" readonly> </th>
								<th>⮜ Sold Final RC </th>

								<th>N°Operation</th>

								<th>Nouveau Sold RC</th>
								<th>Détail</th>
								
							</tr>
							
						</thead>
						
						<tbody>
						
							<tr th:each="hist, info :${history}">
								<!--

								<td th:text="${hist.client.nom}+' '+${hist.client.prenom}"></td> 
								<td th:text="${hist.registre_commerce.numero_rc}"></td>
								<td th:text="${hist.registre_commerce.nom}+' '+${hist.registre_commerce.prenom}"></td> -->
								<td th:text="${hist.id}"></td>
								<td th:text="${hist.date}"></td>
								<td th:text="${nums[info.index]}"></td>
								<td th:text="${hist.type_operation}"></td>
								<td th:if="${hist.type_operation}=='Paiement' or ${hist.type_operation}=='Facture Avoire' or ${hist.type_operation}=='Facture Ristourne'" 
									th:text="${#numbers.formatDecimal(hist.montant_operation*(-1), 3, 'WHITESPACE', 2,'POINT')}"></td>
								<td th:unless="${hist.type_operation}=='Paiement' or ${hist.type_operation}=='Facture Avoire' or ${hist.type_operation}=='Facture Ristourne'"

								<!--  <td th:text="${#numbers.formatDecimal(hist.old_sold_client, 3, 'WHITESPACE', 0,'COMMA')}"></td> -->

								<!--  <td th:text="${#numbers.formatDecimal(hist.new_sold_client, 3, 'WHITESPACE', 0,'COMMA')}"></td> -->
								<td th:text="${#numbers.formatDecimal(hist.new_sold_rc, 3, 'WHITESPACE', 2,'POINT')}"></td>
								
								<td style="text-align: center;"> <button type="button" class="btn btn-info info" 
																	th:attr="id_operation=${hist.id_operation},
																			 type_operation=${hist.type_operation}"> 
																		<i class="far fa-info-square"></i>
																 </button> 
								</td>
								
							</tr>

								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								
								
							</tr>
							<!--  
							<tr>
							
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								<th>Sold Final Client ➤</th>
								<th> <input type="text" id="sold_fin_clt" class="form-control" 
								th:value="${#numbers.formatDecimal(sold_fin_clt, 3, 'WHITESPACE', 0,'COMMA')}" readonly> </th>
								<!--  <th> <input type="text" id="sold_fin_rc" class="form-control" 
								th:value="${#numbers.formatDecimal(sold_fin_rc, 3, 'WHITESPACE', 0,'COMMA')}" readonly> </th>
								<th>⮜ Sold Final RC</th> -->
								<!-- 
								<th></th>
								<th></th>
								<th></th>
								<th></th>
								
							</tr>
							-->
						</tfoot>
						
					</table>
				
				</div>
			
			</div>
			
		</div>
		
	</div>
	
	<div id="display_details" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="far fa-user-alt" style="font-size:30px;margin-right:10px;" ></i> <h5 id="title" class="modal-title" > </h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	         
	         <div class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;" id="print_content">
	         
	         	<!-- <iframe id="frame" width="100%" height="100%" onload="ifrhgh()" frameborder="0" src="/new_payment"></iframe> -->
	         
	         </div>
	      
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	      
	    </div>
	  </div>
	</div>

	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone_error" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title_error"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">

	        </button>
	      </div>

	      </div>
	    </div>
