		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\floating-labels.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css">
		
		<link rel="stylesheet" href="resources\Plugins\datatable\css\dataTables.bootstrap4.min.css" />  
		
		<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet"> 
		
		<script  src="resources\additionalJS\jquery-3.2.1.min.js"></script>
		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\sum().js"></script>
		
		<script type="text/javascript" src="resources\Plugins\Table_Export\external\jszip.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\Table_Export\external\FileSaver.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\Table_Export\scripts\excel-gen.js"></script>
		
		<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript">
		
		$(document).ready(function() {
			
			var datatable_config = {
					"language": {
				            "url": "resources/Plugins/datatable/lang/French.json"
				    },
					"ordering": false,
			    	"bPaginate": false,
					"scrollY":"400px",
					"scrollX": "auto",
			        "deferRender": true,
			        initComplete: function () {
			            this.api().columns([0,1,3]).every( function () {
			            	var column = this;
			                var select = $('<select class="selectpicker show-tick" data-width="fit" data-style="btn btn-outline-secondary" '+ 
	                				'data-live-search="true" data-container="body"><option value="">Tout</option></select>')
			                    .appendTo( $(column.footer()).empty() )
			                    .on( 'change', function () {
			                        var val = $.fn.dataTable.util.escapeRegex(
			                            $(this).val()
			                        );
			 
			                        column
			                            .search( val ? '^'+val+'$' : '', true, false )
			                            .draw();
			                    } );
			 
			                column.data().unique().sort().each( function ( d, j ) {
			                    select.append( '<option value="'+d+'">'+d+'</option>' )
			                } );
			                $('.selectpicker').selectpicker('refresh');
			            } );
			        },
					 drawCallback: function () {
						
					      var api = this.api();
					      
					      $( api.column( 4, {page:'current'} ).footer() ).html(
					        api.column( 4, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					 },
		    };
		 		
		 	var table = $('#table').DataTable(datatable_config);
			
			$("#afficher").click(function(){
				console.log("afficher");
				var start = $("#start").val();
				
				var end = $("#end").val();
				
				var id_category = $("#id_category").val();
				
				if(start=="" || end==""){
					
					$("#title").text("Erreur !!!");
					$("#icone_error").attr("class","far fa-exclamation-triangle");
					$("#title_error").text("Erreur");
					$("#text").html("<span> Veuillez selectionner les dates !!! <span>");
					$("#error").modal('show');
					
				}
				else{
					
// 					window.location.replace("print_etat_vente_client?start="+start+"&end="+end+"&id_category="+id_category);
				window.location.replace("etat_vente_client_afficher?start="+start+"&end="+end+"&id_category="+id_category);
					
				}
				
			});
		 	
			$("#print").click(function(){
				
				var id_category = $("#id_category").val();
				
				var start = $("#start").val();
				
				var end = $("#end").val();
				
				$('#print_content').html('<iframe id="frame" width="100%" height="828" frameborder="0" '+
											'src="print_etat_vente_client?start='+start+'&end='+end+'&id_category='+id_category+'"></iframe>');
				
				$("#title").text("Imprimer");
				
				$("#icone").attr("class","far fa-print");
				
				$("#display_details").modal("show");
				
			});
			
			$("#generate").click(function(){
				
				$(".nbr").each(function(){
					
					var s = $(this).text();
					
					$(this).text(s.replace(/ /g, ""));
					
				});
				
				var myExcel = new ExcelGen({
					
					  "src_id": "table",
					
					  "show_header": true
					
				});
				
				myExcel.generate();
			});
			
		});
		
		</script>
		
		<style type="text/css">
		
			.cc{
			
				text-align: center;
			
			}
			
			.rr{
			
				text-align: right;
			
			}
			
		</style>
		
</head>
<body>
	
	<div class="container-fluid h-100"> <!-- h-100 -->
		
		<div class="card">
		
			<h3 class="card-header  text-center"> <i class="far fa-history"></i> Etat des vente par client </h3>
			<br>
			
			<div class="card-body">
			
				<div class="container-fluid">
					
					<div class="row">
						
						<div class="col-md-4" >
						
							<div class="input-group">
										
								<button id="print" class="btn btn-secondary" type="button">Imprimer</button>
								
								<input id="start" type="date" name="start"  class="form-control date" style="" 
								th:value="${start}" placeholder="DU">
								<span class="input-group-text declaration far fa-calendar-alt"> </span>
								<input id="end" type="date" name="end"  class="form-control date" style="" 
								th:value="${end}" placeholder="AU">
								
								<button id="afficher" class="btn btn-secondary" type="button">Afficher</button>
										
							</div>
						
						</div>
						
						<div class="col-md-2 offset-md-1" >
						
							<select id="id_category" name="id_category" class="form-control">
							
								<option th:each="cat : ${cat_prod}" th:value="${cat.id}" th:text="${cat.nom_category}"></option>
							
							</select>
						
						</div>
						
						<div class="col-md-1" >
						
							<button class="btn btn-primary" id="generate">Excel</button>
						
						</div>
						
					</div>
					
					<hr>
					
					<table id="table" class="table table-bordered table-hover" style="width:100%">
					
						<thead class="thead-dark">
							
							<tr>
							
								<th>N° RC</th>
								<th>Libelle Client</th>
								<th>Adresse</th>
								<th>Category</th>	
								<th>Quantite</th>		
								
							</tr>
							
						</thead>
						
						<tbody>
							<tr th:each="d : ${data}">
								
								<td th:text="${d[1]}"></td>
								<td th:text="${d[2]}"></td>
								<td th:text="${d[3]}"></td>
								<td th:text="${d[4]}"></td>
								<td th:text="${#numbers.formatDecimal(d[5], 2, 'WHITESPACE', 3,'POINT')}"></td>
							</tr>
						</tbody>
						
						<tfoot class="thead-dark">
							
							<tr>
								
								<td></td>
								<td></td>
								<td></td>
								<td></td>
								<td></td>
							</tr>
							
						</tfoot>
						
						
					</table>
				
				</div>
			
			</div>
			
		</div>
		
	</div>
	
	<div id="display_details" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="far fa-user-alt" style="font-size:30px;margin-right:10px;" ></i> <h5 id="title" class="modal-title" > </h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	         
	         <div id="print_content" class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;">
	         
	         	<!-- <iframe id="frame" width="100%" height="100%" onload="ifrhgh()" frameborder="0" src="/new_payment"></iframe> -->
	         
	         </div>
	         
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	      
	    </div>
	  </div>
	</div>
	
	<!-- ---------------------------------------------------------- ------ ----------------------------------------------------------------------------------- -->
	
	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone_error" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title_error"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <p id="text"></p>
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
