<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">
		<title> </title>
		
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\floating-labels.css">
		<link rel="stylesheet" href="resources\Plugins\bootstrap-select-1.13.7\dist\css\bootstrap-select.min.css">
		
		<link rel="stylesheet" href="resources\Plugins\datatable\css\dataTables.bootstrap4.min.css" />  
		
		<link rel="stylesheet" href="resources\Plugins\datatable\js_additional\buttons.dataTables.min.css" />  
		
		<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet"> 
		
		<script  src="resources\additionalJS\jquery-3.2.1.min.js"></script>
		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\sum().js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\dataTables.buttons.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\buttons.html5.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\buttons.print.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\buttons.colVis.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\vfs_fonts.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\buttons.colVis.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\pdfmake.min.js"></script>
		
		<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript" >
		
		$(document).ready(function() {
			
			var h = window.innerHeight;
			
			var datatable_config = {
					"language": {
				            "url": "resources/Plugins/datatable/lang/French.json"
				    },
					"ordering": true,
			    	"bPaginate": false,
					"scrollY":"400px",
					"scrollX": "auto",
			        "deferRender": true,
			        //dom: '<"top"B l f>rt<"bottom"ip>',
	                 dom: 'Bfrtip',
	                 buttons: [
	                        /*   {
	                               extend: 'print',
	                               footer: true,
	                               exportOptions: {
	                                   columns: ':visible'
	                               }
	                           },'excelHtml5',*/
	                           //'colvis'
	                       ], 
	                      
			        initComplete: function () {
			            this.api().columns([1]).every( function () {
			                var column = this;
			                var select = $('<select class="form-control" ><option value=""></option></select>')
			                    .appendTo( $(column.footer()).empty() )
			                    .on( 'change', function () {
			                        var val = $.fn.dataTable.util.escapeRegex(
			                            $(this).val()
			                        );
			 
			                        column
			                            .search( val ? '^'+val+'$' : '', true, false )
			                            .draw();
			                    } );
			 
			                column.data().unique().sort().each( function ( d, j ) {
			                    select.append( '<option value="'+d+'">'+d+'</option>' )
			                } );
			            } );
			        },
					 drawCallback: function () {
						
					      var api = this.api();
					      
					      $( api.column( 3, {page:'current'} ).footer() ).html(
					        api.column( 3, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      /*
					      $( api.column( 3, {page:'current'} ).footer() ).html(
					        api.column( 3, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					       */
					 },
		    };
		 		
		 	var table = $('#table').DataTable(datatable_config);
			
			$("#afficher").click(function(){
				
				var start = $("#start").val();
				
				var end = $("#end").val();
				
				if(start=="" || end==""){
					
					$("#title").text("Erreur !!!");
					$("#icone").attr("class","far fa-exclamation-triangle");
					$("#text").html("<span> Veuillez selectionner les dates !!! <span>");
					$("#error").modal('show');
					
				}
				else{
					
					//console.log("start = "+start+" / end = "+end);
					window.location.replace("etat_sortie_subvension?start="+start+"&end="+end);
					
				}
				
			});
			
			$("#print").click(function(){
				
				var id_rc = $("#rc").val();
				
				var start = $("#start").val();
				
				var end = $("#end").val();
				
				$('#print_content').html('<iframe id="frame" width="100%" height="828" frameborder="0" '+
											'src="print_quant_sub?start='+start+'&end='+end+'"></iframe>');
				
				$("#title").text("Imprimer");
				
				$("#icone").attr("class","far fa-print");
				
				$("#display_details").modal("show");
				
			});
			
			/////////////////------------- END ----------------- 
		});
		
		</script>
		
		
</head>
<body>
	
	<div class="container-fluid h-100">
		
		<div class="card">
		
			
			<h3 class="card-header  text-center"> <i class="far fa-list-alt"></i> Etat des ventes issues de Meunerie des bles SUB </h3>
			<br>
			
			<div class="card-body">
			
				<div class="container-fluid">
					
					<div class="row">
						
						<div class="col-md-4" >
						
							<div class="input-group">
									
								<div class="input-group-append">
										
									<button id="print" class="btn btn-secondary" type="button">Imprimer</button>
									
									<input id="start" type="date" name="start"  class="form-control date" style="width:100%;" 
									th:value="${start}" placeholder="DU">
									<span class="input-group-text declaration far fa-calendar-alt"> </span>
									<input id="end" type="date" name="end"  class="form-control date" style="width:100%;" 
									th:value="${end}" placeholder="AU">
									
									<button id="afficher" name="afficher" class="btn btn-dark" type="button">Afficher</button>
									
								</div>
								
							</div>
						
						</div>
					
					</div>
					
				
				</div>
			
			</div>
			
		</div>
		
	</div>
	
	<div id="display_details" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="far fa-user-alt" style="font-size:30px;margin-right:10px;" ></i> <h5 id="title" class="modal-title" > </h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      
		      <div class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;" id="print_content">
		         
		         	<!-- <iframe id="frame" width="100%" height="100%" onload="ifrhgh()" frameborder="0" src="/new_payment"></iframe> -->
		         
		      </div>
	      
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	      
	    </div>
	  </div>
	</div>
	
	<!-- ---------------------------------------------------------- ------ ----------------------------------------------------------------------------------- -->
	
	
	
</body>
</html>
