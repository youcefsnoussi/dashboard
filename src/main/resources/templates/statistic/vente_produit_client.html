			var datatable_config = {
					"language": {
				            "url": "resources/Plugins/datatable/lang/French.json"
				    },
					"ordering": true,
			    	"bPaginate": false,
					"scrollY":"400px",
					"scrollX": "auto",
			        "deferRender": true,
			        initComplete: function () {
			            this.api().columns([1]).every( function () {
			                var column = this;
			                var select = $('<select class="form-control" ><option value=""></option></select>')
			                    .appendTo( $(column.footer()).empty() )
			                    .on( 'change', function () {
			                        var val = $.fn.dataTable.util.escapeRegex(
			                            $(this).val()
			                        );
			 
			                        column
			                            .search( val ? '^'+val+'$' : '', true, false )
			                            .draw();
			                    } );
			 
			                column.data().unique().sort().each( function ( d, j ) {
			                    select.append( '<option value="'+d+'">'+d+'</option>' )
			                } );
			            } );
			        },
					 drawCallback: function () {
						
					      var api = this.api();
					      
					      $( api.column( 2, {page:'current'} ).footer() ).html(
					        api.column( 2, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					 },
		    };
		 		
		 	var table = $('#table').DataTable(datatable_config);
			
			$("#afficher").click(function(){
				
				var start = $("#start").val();
				
				var end = $("#end").val();
				
				var id_rc = $("#rc").val();
				
				if(start=="" || end=="" || id_rc==0){
					
					$("#title").text("Erreur !!!");
					$("#icone_error").attr("class","far fa-exclamation-triangle");
					$("#title_error").text("Erreur");
					$("#text").html("<span> Veuillez selectionner les dates !!! et un RC !!!<span>");
					$("#error").modal('show');
					
				}
				else{
					
					//console.log("start = "+start+" / end = "+end);
					window.location.replace("vente_produit_client?start="+start+"&end="+end+"&id_rc="+id_rc);
					
				}
				
			});
		 	
			$("#print").click(function(){
				
				var id_rc = $("#rc").val();
				
				var start = $("#start").val();
				
				var end = $("#end").val();
				
				$('#print_content').html('<iframe id="frame" width="100%" height="828" frameborder="0" '+
											'src="print_vente_produit_client?id_rc='+id_rc+'&start='+start+'&end='+end+'"></iframe>');
				
				$("#title").text("Imprimer");
				
				$("#icone").attr("class","far fa-print");
				
				$("#display_details").modal("show");
				
			});
			
			$("#generate").click(function(){
				
				$(".nbr").each(function(){
					
					var s = $(this).text();
					
					$(this).text(s.replace(/ /g, ""));
					
				});
				
				var myExcel = new ExcelGen({
					
					  "src_id": "table",
					
					  "show_header": true
					
				});
				
				myExcel.generate();
				/*
				$(".nbr").each(function(){
					
					var s = $(this).text();
					
					$(this).text(s.formatMoney(2, '.', ' '));
					
				});
				*/
			});
			
			var dist_from_top = $(".details").offset().top+21;
			
			$(".details").attr("style","overflow-y: scroll;height:calc(100vh - "+dist_from_top+"px);");
			
		});
		
		
		
		</script>

<body>
	
	<div class="container-fluid h-100"> <!-- h-100 -->
		
		<div class="card">
		
			<h3 class="card-header  text-center"> <i class="far fa-history"></i> Vente Par Produit/Client </h3>
			<br>
			
			<div class="card-body">
			
				<div class="container-fluid">
					
					<div class="row">
					
						<div class="col-md-3" >
						
							<label>Registre Commerce</label>
							<select class="selectpicker" data-style="btn btn-outline-secondary" data-live-search="true"
																								name="rc" id="rc" data-size="5">
								<option  value="0" th:if="${id_rc}==0" selected>RC</option>
								<option  value="0" th:unless="${id_rc}==0" >RC</option>
								
								<option th:each="rc:${list_rc}" th:value="${rc.id}" th:text="${rc.code}"  
										th:attr="data-subtext=${rc.nom}+' '+${rc.prenom}" th:if="${rc.id} != ${id_rc}"></option>
								
								<option th:each="rc:${list_rc}" th:value="${rc.id}" th:text="${rc.code}"  
										th:attr="data-subtext=${rc.nom}+' '+${rc.prenom}" th:unless="${rc.id} != ${id_rc}" selected></option>
								
							</select>
							
						</div>
						
						<div class="col-md-3" >
						
							<div class="input-group">
								
								<button id="print" class="btn btn-secondary" type="button">Imprimer</button>
								
								<input id="start" type="date" name="start"  class="form-control date" style="" 
								th:value="${start}" placeholder="DU">
								<span class="input-group-text declaration far fa-calendar-alt"> </span>
								<input id="end" type="date" name="end"  class="form-control date" style="" 
								th:value="${end}" placeholder="AU">
								
								<button id="afficher" name="afficher" class="btn btn-dark" type="button">Afficher</button>
									
							</div>
						
						</div>
						<!--  
						<div class="col-md-1" >
						
							<button class="btn btn-primary" id="generate">Excel</button>
						
						</div>
						-->
					</div>
					
					<hr>
					
					<div class="details_global details" >
					
						<div class="dd" th:each="art,i : ${arts}">
							
							<h5 th:text="${art}"></h5>
							<hr>
							
							<table class="table table-dark table-hover">
							
								<thead>
								
									<tr>
									
										<th class="cc">N° Fact</th>
										<th class="cc">Date</th>
										<th class="cc">Qte</th>
										<th class="cc">PU</th>
										<th class="cc">Montant HT</th>
										<th class="cc">TVA</th>
										<th class="cc">Montant TTC</th>
										<th class="cc">Matricule</th>
									
									</tr>
								
								</thead>
								
								<tbody>
								 
									<tr th:each="det : ${list.get(i.index).get(art)}">
									
										<td class="cc" th:text="${det[0]}"></td>
										<td class="cc" th:text="${det[1]}"></td>
										<td class="cc" th:text="${det[2]}"></td>
										<td class="cc" th:text="${#numbers.formatDecimal(det[3], 3, 'WHITESPACE', 2,'COMMA')}"></td>
										<td class="cc" th:text="${#numbers.formatDecimal(det[4], 3, 'WHITESPACE', 2,'COMMA')}"></td>
										<td class="cc" th:text="${det[5]}"></td>
										<td class="cc" th:text="${#numbers.formatDecimal(det[6], 3, 'WHITESPACE', 2,'COMMA')}"></td>
										<td class="cc" th:text="${det[7]}"></td>
									
									</tr>
								
								</tbody>
								
							</table>
							
							<hr>
							
						</div>
					
					</div>
				
				</div>
			
			</div>
			
		</div>
		
	</div>
	
	<div id="display_details" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="far fa-user-alt" style="font-size:30px;margin-right:10px;" ></i> <h5 id="title" class="modal-title" > </h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	         
	         <div class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;" id="print_content">
	         
	         	<!-- <iframe id="frame" width="100%" height="100%" onload="ifrhgh()" frameborder="0" src="/new_payment"></iframe> -->
	         
	         </div>
	      
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	      
	    </div>
	  </div>
	</div>

	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone_error" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title_error"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <p id="text"></p>
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
