	<head>
		<meta charset="utf-8"  name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="stylesheet" href="resources\Plugins\bootstrap-4.3.1\css\bootstrap.min.css">

		<link rel="stylesheet" href="resources\Plugins\datatable\js_additional\buttons.dataTables.min.css" />  
		
		<link href="resources\Plugins\Font-Awsom-Pro-5.8.2\css\all.css" rel="stylesheet"> 
		
		<script  src="resources\additionalJS\jquery-3.2.1.min.js"></script>
		<script  src="resources\Plugins\bootstrap-4.3.1\js\bootstrap.bundle.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\datatable\js\jquery.dataTables.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js\dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\sum().js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\dataTables.buttons.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\buttons.html5.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\buttons.print.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\buttons.colVis.min.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\vfs_fonts.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\buttons.colVis.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\datatable\js_additional\pdfmake.min.js"></script>
		
		<script type="text/javascript" src="resources\additionalJS\drahem.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\Table_Export\external\jszip.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\Table_Export\external\FileSaver.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\Table_Export\scripts\excel-gen.js"></script>
		
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\bootstrap-select.min.js"></script>
		<script type="text/javascript" src="resources\Plugins\bootstrap-select-1.13.7\dist\js\i18n\defaults-fr_FR.min.js"></script>
		
		<script type="text/javascript" >
		
		$(document).ready(function() {
			
			
			
			var h = window.innerHeight;
			
			var datatable_config = {
					"language": {
				            "url": "resources/Plugins/datatable/lang/French.json"
				    },
					"ordering": true,
			    	"bPaginate": false,
					"scrollY":h-510,
					"scrollX": "auto",
			        "deferRender": true,
			        //dom: '<"top"B l f>rt<"bottom"ip>',
	                /* dom: 'Bfrtip',
	                 buttons: [ 'excelHtml5',
	                           {
	                               extend: 'print',
	                               footer: true,
	                               exportOptions: {
	                                   columns: ':visible'
	                               }
	                           },
	                           'colvis'
	                       ], */
	                       
			        initComplete: function () {
			            this.api().columns([0,1]).every( function () {
			                var column = this;
			                var select = $('<select class="form-control" ><option value="">Tout</option></select>')
			                    .appendTo( $(column.footer()).empty() )
			                    .on( 'change', function () {
			                        var val = $.fn.dataTable.util.escapeRegex(
			                            $(this).val()
			                        );
			 
			                        column
			                            .search( val ? '^'+val+'$' : '', true, false )
			                            .draw();
			                    } );
			 
			                column.data().unique().sort().each( function ( d, j ) {
			                    select.append( '<option value="'+d+'">'+d+'</option>' )
			                } );
			            } );
			        },
					 drawCallback: function () {
						
					      var api = this.api();
					      
					      $( api.column( 3, {page:'current'} ).footer() ).html(
					        api.column( 3, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					      $( api.column( 5, {page:'current'} ).footer() ).html(
					        api.column( 5, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					      $( api.column( 6, {page:'current'} ).footer() ).html(
					        api.column( 6, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					      $( api.column( 7, {page:'current'} ).footer() ).html(
					        api.column( 7, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					       
					 },
		    };
		 		
		 	var table = $('#table').DataTable(datatable_config);
			
		 	var table1 = $('#table1').DataTable(datatable_config);
		 	
			//------------------- TO RENDER table header and footer between tabs
		 	
		 	$('a[data-toggle="tab"]').on( 'shown.bs.tab', function (e) {
		        $.fn.dataTable.tables( {visible: true, api: true} ).columns.adjust();
		    } );
		 	
		 	//------------------- ------------------------------------------------------
		 	
			$("#afficher").click(function(){
				
				var start = $("#debut").val();
				
				var end = $("#fin").val();
				
				if(start=="" || end==""){
					
					$("#title").text("Erreur !!!");
					$("#icone").attr("class","far fa-exclamation-triangle");
					$("#text").html("<span> Veuillez selectionner les dates !!! <span>");
					$("#error").modal('show');
					
				}
				else{
					
					window.location.replace("historic_ventes_val?start="+start+"&end="+end);
					
				}
				
			});
			
			$("#print").click(function(){
				
				var start = $("#debut").val();
				
				var end = $("#fin").val();
				
				$('#print_content').html('<iframe id="frame" width="100%" height="828" onload="ifrhgh()" frameborder="0" '+
											'src="print_vente_produit_global?start='+start+'&end='+end+'"></iframe>');
				
				$("#title").text("Imprimer");
				
				$("#icone").attr("class","far fa-print");
				
				$("#frame").modal("show");
				
			});
			
			$("#today").click(function(){
					
				//console.log("start = "+start+" / end = "+end);
				window.location.replace("historic_ventes_val?start=0&end=0");
				
				
			});
			
			$("#generate").click(function(){
				
				$(".nbr").each(function(){
					
					var s = $(this).text();
					
					$(this).text(s.replace(/ /g, ""));
					
				});
				
				var myExcel = new ExcelGen({
					
					  "src_id": "table",
					
					  "show_header": true
					
				});
				
				myExcel.generate();
				/*
				$(".nbr").each(function(){
					
					var s = $(this).text();
					
					$(this).text(s.formatMoney(2, '.', ' '));
					
				});
				*/
			});
			
			/////////////////------------- END ----------------- 
		});
		
		</script>
		
		<style type="text/css">
		
			.cc{
			
				text-align: center;
			
			}
			
			.rr{
			
				text-align: right;
			
			}
			
		</style>
		
</head>
<body>
	
	<div class="container-fluid h-100">
		
		<div class="card">
		
			
			<h3 class="card-header  text-center"> <i class="far fa-list-alt"></i>  Quantité Vendu par Article Valorisé</h3>
			<br>
			
			<div class="card-body">
			
				<div class="container-fluid">
					
					<div class="row">
						
						<div class="col-md-4" >
						
							<div class="input-group">
									
								<div class="input-group-append">
									<button id="print" class="btn btn-dark" type="button">Imprimer</button>
									
									<input id="debut" type="date" name="start" th:value="${start}"  class="form-control date" 
										style="width:100%;" placeholder="DU">
										
									<span class="input-group-text declaration"><i class="far fa-calendar-alt"></i> </span>
									
									<input id="fin" type="date" name="end" th:value="${end}" class="form-control date" 
									style="width:100%;" placeholder="AU">
									
									<button id="afficher" name="afficher" class="btn btn-dark" type="button">Afficher</button>
									
								</div>
								
							</div>
						
						</div>
						
						<div class="col-md-1" >
							
							<button id="today" name="today" class="btn btn-dark" type="button">Aujourd'hui</button>
								
							
						</div>
						
						<div class="col-md-1" >
						
							<button class="btn btn-primary" id="generate">Excel</button>
						
						</div>
						
					</div>
					<hr>
					
					<ul class="nav nav-tabs" id="myTab" role="tablist">
					
					  <li class="nav-item">
					    <a class="nav-link active" data-toggle="tab" href="#Quant_Fact" role="tab" aria-controls="info" 
					    	aria-selected="true">Quantité Facturé</a>
					  </li>
					  
					  <li class="nav-item">
					    <a class="nav-link" data-toggle="tab" href="#Quant_BL" role="tab" aria-controls="info" aria-selected="true">
					    	Quantité Bls</a>
					  </li>
					
					</ul>
					
					<div class="tab-content" id="nav-tabContent">
						
						<div class="tab-pane fade show active" id="Quant_Fact" role="tabpanel" aria-labelledby="nav_Quant_Fact">
							
							<br>
							<table id="table" class="table table-bordered table-hover" style="width:100%">
							
								<thead class="thead-dark">
								
									<tr>
									
										<th class="cc" >Code</th>
										<th>Category</th>
										<th>Désignation</th>
										<th class="cc" >Quantité (Q)</th>
										<th class="cc" >Prix U</th>
										<th class="rr" >Montant HT (DA)</th>
										<th class="rr" >Montant TVA (DA)</th>
										<th class="rr" >Montant TTC (DA)</th>
										
									</tr>
								
								</thead>
								
								<tbody>
								
									<tr th:each="lst:${list}" >
										
										<td class="cc"  th:text="${lst[0]}"></td>
										<td th:text="${lst[1]}+' '+${lst[2]}"></td>
										<td th:text="${lst[3]}"></td>
										
										<td class="cc"  th:text="${#numbers.formatDecimal(lst[4], 3, 'WHITESPACE', 2,'POINT')}"></td>
										<td class="rr"  th:text="${#numbers.formatDecimal(lst[5], 3, 'WHITESPACE', 2,'POINT')}"></td>
										<td class="rr"  th:text="${#numbers.formatDecimal(lst[6], 3, 'WHITESPACE', 2,'POINT')}"></td>
										<td class="rr"  th:text="${#numbers.formatDecimal(lst[7], 3, 'WHITESPACE', 2,'POINT')}"></td>
										<td class="rr"  th:text="${#numbers.formatDecimal(lst[8], 3, 'WHITESPACE', 2,'POINT')}"></td>
										
									</tr>
								
								</tbody>
								
								<tfoot class="thead-dark">
									
									<tr>
										
										<th class="cc" ></th>
										<th></th>
										<th></th>
										<th class="cc" ></th>
										<th class="cc" ></th>
										<th class="rr" ></th>
										<th class="rr" ></th>
										<th class="rr" ></th>
										
									</tr>
									
								</tfoot>
								
							</table>
							
						</div>
						
						<div class="tab-pane fade" id="Quant_BL" role="tabpanel" aria-labelledby="nav_Quant_BL">
							
							<br>
							<table id="table1" class="table table-bordered table-hover" style="width:100%">
							
								<thead class="thead-dark">
								
									<tr>
									
										<th class="cc" >Code</th>
										<th>Category</th>
										<th>Désignation</th>
										<th class="cc" >Quantité (Q)</th>
										<th class="cc" >Prix U</th>
										<th class="rr" >Montant HT (DA)</th>
										<th class="rr" >Montant TVA (DA)</th>
										<th class="rr" >Montant TTC (DA)</th>
										
									</tr>
								
								</thead>
								
								<tbody>
								
									<tr th:each="lst:${list1}" >
										
										<td class="cc"  th:text="${lst[0]}"></td>
										<td th:text="${lst[1]}+' '+${lst[2]}"></td>
										<td th:text="${lst[3]}"></td>
										
										<td class="cc"  th:text="${#numbers.formatDecimal(lst[4], 3, 'WHITESPACE', 2,'POINT')}"></td>
										<td class="rr"  th:text="${#numbers.formatDecimal(lst[5], 3, 'WHITESPACE', 2,'POINT')}"></td>
										<td class="rr"  th:text="${#numbers.formatDecimal(lst[6], 3, 'WHITESPACE', 2,'POINT')}"></td>
										<td class="rr"  th:text="${#numbers.formatDecimal(lst[7], 3, 'WHITESPACE', 2,'POINT')}"></td>
										<td class="rr"  th:text="${#numbers.formatDecimal(lst[8], 3, 'WHITESPACE', 2,'POINT')}"></td>
										
									</tr>
								
								</tbody>
								
								<tfoot class="thead-dark">
									
									<tr>
										
										<th class="cc" ></th>
										<th></th>
										<th></th>
										<th class="cc" ></th>
										<th class="cc" ></th>
										<th class="rr" ></th>
										<th class="rr" ></th>
										<th class="rr" ></th>
										
									</tr>
									
								</tfoot>
								
							</table>
						
						</div>
						
					</div>
					
				</div>
			
			</div>
			
		</div>
		
	</div>
	
	<div id="frame" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i class="far fa-user-alt" style="font-size:30px;margin-right:10px;" id="icone"></i> <h5 class="modal-title" id="title"> Nouveau Client </h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      
	      <div class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;" id="print_content">
	        
	         <!--  <iframe id="frame" width="100%" height="100%" onload="ifrhgh()" frameborder="0" src="/add_client"></iframe>  -->
	        
	      </div>
	      
	      <div class="modal-footer">
	        <button type="button" id="closee" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
	
	<!-- ---------------------------------------------------------- ------ ----------------------------------------------------------------------------------- -->
	
	
	
</body>
</html>
