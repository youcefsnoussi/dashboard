			var datatable_config = {
					"language": {
				            "url": "resources/Plugins/datatable/lang/French.json"
				    },
					"ordering": true,
			    	"bPaginate": false,
					"scrollY":"400px",
					"scrollX": "auto",
			        "deferRender": true,/*
			        dom: 'Bfrtip',
	                 buttons: [
	                           {
	                               extend: 'print',
	                               footer: true,
	                               exportOptions: {
	                                   columns: ':visible'
	                               }
	                           },'excelHtml5',
	                           {
	                               extend: 'pdfHtml5',
	                               className: "btn btn-dark",
	                               orientation: 'landscape',
	                               text:'Imprimer',
	                               pageSize: 'A4',
	                               alignment: "center",
	                               title : [{text: 'SEMOULERIE INDUSTRIELLE DE LA MITIDJA'+'\n\n'+
	                               				  'SIM SPA Unité '+$("#unite").val()+'\n\n'+
	                               				  'Etat des sorties (quantitatif)'+'\n\n'+
	                               				  'DU '+$("#start").val()+'  AU '+$("#end").val(), style: 'header' } ],	
	                               filename: 'Etat des sorties (quantitatif)',
	                               exportOptions: {
	                                   columns: ':visible'
	                               },
	                               customize: function(doc) {
	                                   doc.styles.tableBodyEven.alignment = 'center';
	                                   doc.styles.tableBodyOdd.alignment = 'center'; 
	                               },  
	                           }
	                           //,'colvis'
	                       ],*/ 
			        initComplete: function () {
			            this.api().columns([]).every( function () {
			                var column = this;
			                var select = $('<select class="form-control" ><option value=""></option></select>')
			                    .appendTo( $(column.footer()).empty() )
			                    .on( 'change', function () {
			                        var val = $.fn.dataTable.util.escapeRegex(
			                            $(this).val()
			                        );
			 
			                        column
			                            .search( val ? '^'+val+'$' : '', true, false )
			                            .draw();
			                    } );
			 
			                column.data().unique().sort().each( function ( d, j ) {
			                    select.append( '<option value="'+d+'">'+d+'</option>' )
			                } );
			            } );
			        },
					 drawCallback: function () {
						
					      var api = this.api();
					      
					      $( api.column( 1, {page:'current'} ).footer() ).html(
					        api.column( 1, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					      $( api.column( 2, {page:'current'} ).footer() ).html(
					        api.column( 2, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					 },
		    };
		 		
		 	var table = $('#table').DataTable(datatable_config);
			
			$("#afficher").click(function(){
				
				var start = $("#start").val();
				
				var end = $("#end").val();
				
				if(start=="" || end==""){
					
					$("#title").text("Erreur !!!");
					$("#icone_error").attr("class","far fa-exclamation-triangle");
					$("#title_error").text("Erreur");
					$("#text").html("<span> Veuillez selectionner les dates !!! <span>");
					$("#error").modal('show');
					
				}
				else{
					
					spin_it('on');
					window.location.replace("etat_sortie_category?start="+start+"&end="+end);
					
				}
				
			});
			
			$("#generate").click(function(){
				
				$(".nbr").each(function(){
					
					var s = $(this).text();
					
					$(this).text(s.replace(/ /g, ""));
					
				});
				
				var myExcel = new ExcelGen({
					
					  "src_id": "table",
					
					  "show_header": true
					
				});
				
				myExcel.generate();
				/*
				$(".nbr").each(function(){

				});
				*/
			});
			
		});

<body>
	
	<div class="container-fluid h-100"> <!-- h-100 -->
		
		<div class="card">
		
			<h3 class="card-header  text-center"> <i class="far fa-history"></i> Etat des sorties (Quantitatif) </h3>
			<br>
			
			<div class="card-body">
			
				<div class="container-fluid">
					
					<div class="row">
						
						<div class="col-md-4" >
						
							<div class="input-group">
								
								<input id="start" type="date" name="start"  class="form-control date" style="" 
								th:value="${start}" placeholder="DU">
								<span class="input-group-text declaration far fa-calendar-alt"> </span>
								<input id="end" type="date" name="end"  class="form-control date" style="" 
								th:value="${end}" placeholder="AU">
								
								<button id="afficher" class="btn btn-secondary" type="button">Afficher</button>
									
							</div>
						
						</div>
						
						<div class="col-md-1" >
						
							<button class="btn btn-primary" id="generate">Excel</button>
						
						</div>
						
					</div>
					
					<hr>
					
					<input type="hidden" id="unite" th:value="${unite}">
					
					<table id="table" class="table table-bordered table-hover" style="width:100%">
					
						<thead class="thead-dark">
							
							<tr>
							
								<th>Code</th>
								<th>Libelle Client</th>
								<th>N° Facture</th>
								<th th:each = "art:${articles}" th:text="${art.nom_category}"></th>	
								
							</tr>
							
						</thead>
						
						<tbody>
						
							<tr th:each="row : ${rows}">
							
								<td th:each="info : ${row}" th:text="${info}"></td>
							
							</tr>
						
						</tbody>
						
						<tfoot class="thead-dark">
						
							
						
						</tfoot>
						
					</table>
				
				</div>
			
			</div>
			
		</div>
		
	</div>
	
	<div id="display_details" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered mw-100 w-75" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone" class="far fa-user-alt" style="font-size:30px;margin-right:10px;" ></i> <h5 id="title" class="modal-title" > </h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	         
	         <div id="print_content" class="modal-body  embed-responsive embed-responsive-16by9" style="overflow-y:hidden;">
	         
	         	<!-- <iframe id="frame" width="100%" height="100%" onload="ifrhgh()" frameborder="0" src="/new_payment"></iframe> -->
	         
	         </div>
	         
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	      
	    </div>
	  </div>
	</div>
	
	<!-- ---------------------------------------------------------- ------ ----------------------------------------------------------------------------------- -->
	
	<div id="error" class="modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <i id="icone_error" class="" style="font-size:30px;color:red;margin-right:10px;"></i> <h5 class="modal-title" id="title_error"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <p id="text"></p>
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
	      </div>
	    </div>
	  </div>
	</div>
