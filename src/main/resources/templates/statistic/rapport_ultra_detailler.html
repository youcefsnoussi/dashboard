		function IntiateDataTable(data){
			
			var datatable_config = {
					"data" : data,
					"language": {
				       "url": "resources/Plugins/datatable/lang/French.json"
				    },
					"ordering": false,
			    	"bPaginate": false,
					"scrollY":"400px",
					"scrollX": "auto",
			        "deferRender": false,
			        "autoWidth": true,
			        initComplete: function () {
			        	$("#spin").css("display","none");
			        	this.api().columns([1,2,3,4,9,10,11,12,13,14,15,16,17,19,26,26,27,28]).every( function () {
			                var column = this;
			                var select = $('<select class="selectpicker show-tick" data-width="fit" data-style="btn btn-outline-secondary" '+ 
			                				'data-live-search="true" data-container="body"><option value="">Tout</option></select>')
			                    .appendTo( $(column.footer()).empty() )
			                    .on( 'change', function () {
			                        var val = $.fn.dataTable.util.escapeRegex(
			                            $(this).val()
			                        );
			 
			                        column
			                            .search( val ? '^'+val+'$' : '', true, false )
			                            .draw();
			                    } );
			 
			                column.data().unique().sort().each( function ( d, j ) {
			                    select.append( '<option value="'+d+'">'+d+'</option>' )
			                } );
			                $('.selectpicker').selectpicker('refresh');
			          } );
			        },
			        drawCallback: function () {
						
					      var api = this.api();
					      
					      $( api.column( 18, {page:'current'} ).footer() ).html(
					        api.column( 18, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      $( api.column( 20, {page:'current'} ).footer() ).html(
					        api.column( 20, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      $( api.column( 21, {page:'current'} ).footer() ).html(
					        api.column( 21, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      $( api.column( 22, {page:'current'} ).footer() ).html(
					        api.column( 22, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      $( api.column( 24, {page:'current'} ).footer() ).html(
					        api.column( 24, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      $( api.column( 25, {page:'current'} ).footer() ).html(
					        api.column( 25, {page:'current'} ).data().sum().formatMoney(2, ',', ' ')
					      );
					      
					 },
					 
					 "createdRow": function ( row, data, index ) {
						
			         	$('td', row).eq(18).text( parseFloat(data[18]).formatMoney(2, ',', ' ')),
			         	$('td', row).eq(19).text( parseFloat(data[19]).formatMoney(2, ',', ' ')),
			         	$('td', row).eq(20).text( parseFloat(data[20]).formatMoney(2, ',', ' ')),
			         	$('td', row).eq(21).text( parseFloat(data[21]).formatMoney(2, ',', ' ')),
			         	$('td', row).eq(22).text( parseFloat(data[22]).formatMoney(2, ',', ' ')),
			         	$('td', row).eq(23).text( parseFloat(data[23]).formatMoney(2, ',', ' ')),
			         	$('td', row).eq(24).text( parseFloat(data[24]).formatMoney(2, ',', ' ')),
			         	$('td', row).eq(25).text( parseFloat(data[25]).formatMoney(2, ',', ' '))
			         	
					 }	
		    };
			
			return datatable_config;
			
		}
		
		function getData(start, end){
			
			let data = new Array();
			
			$.ajaxSetup({async: false});
			$.ajax({
				url: 'ajax_rapport_ultra_detailler',
				//type: 'POST',
				dataType: 'json',
				data : {
					start : start,
					end : end
		        },
		        success : function(responseJson) {
					
					if (responseJson != "null") {

						$.each(responseJson, function(key, value) {
							
							data.push(value);

						});
						
					}
					
				}
			});
			
			return data;
			
		}
